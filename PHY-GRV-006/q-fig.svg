<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
<defs>
<marker id="q-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#1f5fbf"/></marker>
<marker id="q-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#222"/></marker>
</defs>
<!-- observer -->
<rect x="28" y="105" width="56" height="90" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="56" y="140" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">観測者</text>
<text x="56" y="168" text-anchor="middle" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">O</text>
<!-- line of sight -->
<line x1="84" y1="150" x2="560" y2="150" stroke="#888" stroke-width="1" stroke-dasharray="5,4"/>
<line x1="130" y1="232" x2="250" y2="232" stroke="#222" stroke-width="1.6" marker-end="url(#q-ak)"/>
<text x="190" y="256" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">視線方向（<tspan font-family="Times New Roman, serif" font-style="italic">x</tspan> の正の向き）</text>
<!-- orbits -->
<circle cx="420" cy="150" r="110" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
<circle cx="420" cy="150" r="24" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
<!-- centre of mass -->
<circle cx="420" cy="150" r="2.8" fill="#222"/>
<text x="428" y="144" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">C</text>
<!-- separation line -->
<line x1="408" y1="170.8" x2="475" y2="54.7" stroke="#222" stroke-width="1" stroke-dasharray="2,3"/>
<text x="452" y="108" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">d</text>
<!-- planet -->
<circle cx="475" cy="54.7" r="7" fill="#222"/>
<text x="488" y="50" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">惑星 p（<tspan font-family="Times New Roman, serif" font-style="italic">m</tspan>）</text>
<!-- pulsar -->
<circle cx="408" cy="170.8" r="6" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="376" y="204" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">パルサー S（<tspan font-family="Times New Roman, serif" font-style="italic">M</tspan>）</text>
<!-- pulses toward observer -->
<path d="M392,162 A16,16 0 0,0 392,180" fill="none" stroke="#222" stroke-width="1"/>
<path d="M384,157 A24,24 0 0,0 384,185" fill="none" stroke="#222" stroke-width="1"/>
<path d="M376,152 A32,32 0 0,0 376,190" fill="none" stroke="#222" stroke-width="1"/>
<!-- revolution direction -->
<path d="M519.7,196.5 A110,110 0 0,0 529.6,140.4" fill="none" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#q-ab)"/>
<text x="536" y="192" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#1f5fbf">公転</text>
</svg>
