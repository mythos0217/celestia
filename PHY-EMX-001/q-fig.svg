<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <defs>
    <marker id="q-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
    <marker id="q-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <!-- strips (side view) -->
  <rect x="110" y="96" width="330" height="6" fill="none" stroke="#222" stroke-width="1.6"/>
  <rect x="110" y="148" width="330" height="6" fill="none" stroke="#222" stroke-width="1.6"/>
  <text x="270" y="88" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">P</text>
  <text x="270" y="178" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">Q</text>
  <!-- battery at left: P to + -->
  <polyline points="110,99 60,99 60,114" fill="none" stroke="#222" stroke-width="1.6"/>
  <line x1="44" y1="114" x2="76" y2="114" stroke="#222" stroke-width="1.6"/>
  <line x1="52" y1="122" x2="68" y2="122" stroke="#222" stroke-width="3"/>
  <polyline points="60,122 60,151 110,151" fill="none" stroke="#222" stroke-width="1.6"/>
  <text x="18" y="124" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">V</text>
  <!-- resistor at right -->
  <polyline points="440,99 490,99 490,105" fill="none" stroke="#222" stroke-width="1.6"/>
  <rect x="482" y="105" width="16" height="40" fill="none" stroke="#222" stroke-width="1.6"/>
  <polyline points="490,145 490,151 440,151" fill="none" stroke="#222" stroke-width="1.6"/>
  <text x="506" y="131" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">R</text>
  <!-- current arrows -->
  <line x1="300" y1="80" x2="350" y2="80" stroke="#222" stroke-width="1.4" marker-end="url(#q-ak)"/>
  <text x="356" y="85" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">I</text>
  <line x1="350" y1="172" x2="300" y2="172" stroke="#222" stroke-width="1.4" marker-end="url(#q-ak)"/>
  <text x="356" y="177" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">I</text>
  <!-- h dimension -->
  <line x1="150" y1="102" x2="150" y2="148" stroke="#888" stroke-width="1" marker-start="url(#q-ag)" marker-end="url(#q-ag)"/>
  <text x="156" y="130" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">h</text>
  <!-- length -->
  <line x1="110" y1="200" x2="440" y2="200" stroke="#888" stroke-width="1" marker-start="url(#q-ag)" marker-end="url(#q-ag)"/>
  <text x="270" y="218" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">ℓ</text>
  <text x="110" y="250" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">横から見た図（縦方向は拡大）</text>
  <!-- cross-section inset -->
  <rect x="455" y="208" width="110" height="5" fill="none" stroke="#222" stroke-width="1.4"/>
  <rect x="455" y="240" width="110" height="5" fill="none" stroke="#222" stroke-width="1.4"/>
  <line x1="455" y1="268" x2="565" y2="268" stroke="#888" stroke-width="1" marker-start="url(#q-ag)" marker-end="url(#q-ag)"/>
  <text x="504" y="288" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">w</text>
  <line x1="575" y1="213" x2="575" y2="240" stroke="#888" stroke-width="1" marker-start="url(#q-ag)" marker-end="url(#q-ag)"/>
  <text x="580" y="232" font-family="Times New Roman, serif" font-style="italic" font-size="14" fill="#222">h</text>
  <text x="452" y="200" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">断面</text>
</svg>
