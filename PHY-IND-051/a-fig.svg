<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330">
<defs><marker id="a-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<!-- upper: number of spokes in field -->
<line x1="70" y1="150" x2="575" y2="150" stroke="#222" stroke-width="1" marker-end="url(#a-ak)"/>
<line x1="70" y1="160" x2="70" y2="30" stroke="#222" stroke-width="1" marker-end="url(#a-ak)"/>
<text x="20" y="24" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">磁場中のスポークの本数</text>
<line x1="66" y1="110" x2="74" y2="110" stroke="#222"/><text x="52" y="115" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">1</text>
<line x1="66" y1="70" x2="74" y2="70" stroke="#222"/><text x="52" y="75" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">2</text>
<polyline points="70.0,110.0 150.7,110.0 150.7,70.0 230.0,70.0 230.0,110.0 310.7,110.0 310.7,70.0 390.0,70.0 390.0,110.0 470.7,110.0 470.7,70.0 550.0,70.0 550.0,110.0 550.0,110.0" fill="none" stroke="#c0392b" stroke-width="1.8"/>
<!-- lower: power -->
<line x1="70" y1="290" x2="575" y2="290" stroke="#222" stroke-width="1" marker-end="url(#a-ak)"/>
<line x1="70" y1="300" x2="70" y2="185" stroke="#222" stroke-width="1" marker-end="url(#a-ak)"/>
<text x="20" y="180" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">仕事率（発熱率）</text>
<line x1="70" y1="230" x2="550" y2="230" stroke="#1f5fbf" stroke-width="1.8"/>
<text x="400" y="222" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#1f5fbf"><tspan font-family="Times New Roman, serif" font-style="italic">P</tspan> = 2<tspan font-family="Times New Roman, serif" font-style="italic">E</tspan>²/(3<tspan font-family="Times New Roman, serif" font-style="italic">r</tspan>+<tspan font-family="Times New Roman, serif" font-style="italic">s</tspan>)</text>
<line x1="70.0" y1="150" x2="70.0" y2="290" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
<text x="60.0" y="310" font-family="Noto Sans CJK JP, sans-serif" font-size="12" fill="#222">0°</text>
<line x1="150.0" y1="150" x2="150.0" y2="290" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
<text x="140.0" y="310" font-family="Noto Sans CJK JP, sans-serif" font-size="12" fill="#222">60°</text>
<line x1="230.0" y1="150" x2="230.0" y2="290" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
<text x="220.0" y="310" font-family="Noto Sans CJK JP, sans-serif" font-size="12" fill="#222">120°</text>
<line x1="310.0" y1="150" x2="310.0" y2="290" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
<text x="300.0" y="310" font-family="Noto Sans CJK JP, sans-serif" font-size="12" fill="#222">180°</text>
<line x1="390.0" y1="150" x2="390.0" y2="290" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
<text x="380.0" y="310" font-family="Noto Sans CJK JP, sans-serif" font-size="12" fill="#222">240°</text>
<line x1="470.0" y1="150" x2="470.0" y2="290" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
<text x="460.0" y="310" font-family="Noto Sans CJK JP, sans-serif" font-size="12" fill="#222">300°</text>
<line x1="550.0" y1="150" x2="550.0" y2="290" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
<text x="540.0" y="310" font-family="Noto Sans CJK JP, sans-serif" font-size="12" fill="#222">360°</text>
<text x="420" y="326" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">OP<tspan baseline-shift="sub" font-size="10">1</tspan> の向き（<tspan font-family="Times New Roman, serif" font-style="italic">x</tspan> 軸から）</text>
<text x="300" y="58" font-family="Noto Sans CJK JP, sans-serif" font-size="12" fill="#222">1本と2本が 60° ごとに交互</text>
</svg>
