<!-- radius label -->
<text x="318" y="168" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">a</text>
<!-- rotation arrow CCW -->
<path d="M 370 70 A 175 175 0 0 0 290 32" fill="none" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#q-ah)"/>
<text x="352" y="44" font-family="Times New Roman, serif" font-style="italic" font-size="17" fill="#1f5fbf">ω</text>
<text x="20" y="40" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">スポークの抵抗：各 <tspan font-family="Times New Roman, serif" font-style="italic" font-size="15">r</tspan></text>
<text x="20" y="60" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">各弧の抵抗：<tspan font-family="Times New Roman, serif" font-style="italic" font-size="15">s</tspan></text>
</svg>
