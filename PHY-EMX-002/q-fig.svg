<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340">
  <defs>
    <marker id="q-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
    <marker id="q-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="q-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="q-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker>
  </defs>
  <!-- cylinder shell -->
  <ellipse cx="110" cy="160" rx="22" ry="70" fill="none" stroke="#222" stroke-width="1.6"/>
  <path d="M 490 90 A 22 70 0 0 1 490 230" fill="none" stroke="#222" stroke-width="1.6"/>
  <path d="M 490 90 A 22 70 0 0 0 490 230" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="110" y1="90" x2="490" y2="90" stroke="#222" stroke-width="1.6"/>
  <line x1="110" y1="230" x2="490" y2="230" stroke="#222" stroke-width="1.6"/>
  <!-- circumferential currents (front halves) -->
  <g fill="none" stroke="#c0392b" stroke-width="1.6">
    <path d="M 190 90 A 22 70 0 0 1 212 160" marker-end="url(#q-ar)"/><path d="M 212 160 A 22 70 0 0 1 190 230"/>
    <path d="M 300 90 A 22 70 0 0 1 322 160" marker-end="url(#q-ar)"/><path d="M 322 160 A 22 70 0 0 1 300 230"/>
    <path d="M 410 90 A 22 70 0 0 1 432 160" marker-end="url(#q-ar)"/><path d="M 432 160 A 22 70 0 0 1 410 230"/>
  </g>
  <g fill="none" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3">
    <path d="M 190 90 A 22 70 0 0 0 190 230"/>
    <path d="M 300 90 A 22 70 0 0 0 300 230"/>
    <path d="M 410 90 A 22 70 0 0 0 410 230"/>
  </g>
  <text x="420" y="252" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#c0392b">周方向の電流</text>
  <!-- B field inside -->
  <g stroke="#1f5fbf" stroke-width="1.8">
    <line x1="140" y1="130" x2="250" y2="130" marker-end="url(#q-ab)"/>
    <line x1="140" y1="190" x2="250" y2="190" marker-end="url(#q-ab)"/>
    <line x1="330" y1="130" x2="460" y2="130" marker-end="url(#q-ab)"/>
    <line x1="330" y1="190" x2="460" y2="190" marker-end="url(#q-ab)"/>
  </g>
  <text x="268" y="166" font-family="Times New Roman, serif" font-style="italic" font-size="17" fill="#1f5fbf">B</text>
  <!-- axis -->
  <line x1="60" y1="160" x2="545" y2="160" stroke="#888" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="548" y="165" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#888">軸</text>
  <!-- radius r (left end) -->
  <line x1="110" y1="160" x2="110" y2="92" stroke="#222" stroke-width="1" marker-end="url(#q-ak)"/>
  <text x="116" y="132" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">r</text>
  <!-- length d -->
  <line x1="110" y1="60" x2="490" y2="60" stroke="#222" stroke-width="1" marker-start="url(#q-ak)" marker-end="url(#q-ak)"/>
  <line x1="110" y1="52" x2="110" y2="88" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="490" y1="52" x2="490" y2="88" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="294" y="52" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">d</text>
  <!-- outside pressure -->
  <g stroke="#888" stroke-width="1">
    <line x1="230" y1="285" x2="230" y2="240" marker-end="url(#q-ag)"/>
    <line x1="370" y1="285" x2="370" y2="240" marker-end="url(#q-ag)"/>
  </g>
  <text x="236" y="300" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">外側の気体の圧力</text>
  <text x="352" y="300" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">p</text>
  <text x="361" y="304" font-family="Noto Sans CJK JP, sans-serif" font-size="10" fill="#222">e</text>
  <text x="40" y="326" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">超伝導の薄い円筒殻（外部の磁場は 0）</text>
</svg>
