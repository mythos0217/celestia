  <text x="370" y="26" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">(4) 内面：放射率 <tspan font-family="Times New Roman, serif" font-style="italic" font-size="16">ε</tspan>，外面：黒体</text>
