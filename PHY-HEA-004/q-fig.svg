  <text x="112" y="180" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">発熱 <tspan font-family="Times New Roman, serif" font-style="italic" font-size="16">I</tspan>（黒体）</text>
  <!-- panel 4 -->
  <circle cx="450" cy="160" r="80" fill="#888" fill-opacity="0.35" stroke="#222" stroke-width="1.6"/>
