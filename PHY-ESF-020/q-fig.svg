<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320">
  <defs>
    <marker id="q-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
    <marker id="q-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
  </defs>
  <!-- plates -->
  <rect x="70" y="56" width="330" height="6" fill="none" stroke="#222" stroke-width="1.6"/>
  <rect x="70" y="250" width="330" height="6" fill="none" stroke="#222" stroke-width="1.6"/>
  <text x="48" y="64" font-family="Noto Sans CJK JP, sans-serif" font-size="16" fill="#222">B</text>
  <text x="48" y="258" font-family="Noto Sans CJK JP, sans-serif" font-size="16" fill="#222">A</text>
  <!-- d dimension -->
  <line x1="30" y1="62" x2="30" y2="250" stroke="#222" stroke-width="1" marker-start="url(#q-ak)" marker-end="url(#q-ak)"/>
  <text x="14" y="162" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">d</text>
  <!-- wires to ground -->
  <polyline points="400,59 470,59 470,290" fill="none" stroke="#222" stroke-width="1.6"/>
  <polyline points="400,253 430,253 430,263" fill="none" stroke="#222" stroke-width="1.6"/>
  <circle cx="430" cy="276" r="0" fill="none"/>
  <!-- ammeter on A wire -->
  <line x1="430" y1="253" x2="430" y2="262" stroke="#222" stroke-width="1.6"/>
  <circle cx="430" cy="276" r="13" fill="none" stroke="#222" stroke-width="1.6"/>
  <rect x="418" y="263" width="24" height="26" fill="none" stroke="none"/>
  <text x="424.5" y="281.5" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">A</text>
  <!-- ground symbols -->
  <g stroke="#222" stroke-width="1.6">
    <line x1="430" y1="289" x2="430" y2="296"/><line x1="416" y1="296" x2="444" y2="296"/><line x1="421" y1="301" x2="439" y2="301"/><line x1="426" y1="306" x2="434" y2="306"/>
    <line x1="470" y1="290" x2="470" y2="296"/><line x1="456" y1="296" x2="484" y2="296"/><line x1="461" y1="301" x2="479" y2="301"/><line x1="466" y1="306" x2="474" y2="306"/>
  </g>
  <!-- cover ammeter wire inside circle: redraw wire segments outside circle only -->
  <!-- rod -->
  <line x1="204.2" y1="196.9" x2="255.8" y2="123.1" stroke="#222" stroke-width="2.4"/>
  <circle cx="255.8" cy="123.1" r="6" fill="#c0392b"/>
  <circle cx="204.2" cy="196.9" r="6" fill="#1f5fbf"/>
  <text x="264" y="118" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">+</text>
  <text x="275" y="118" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">q</text>
  <text x="178" y="214" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">−</text>
  <text x="190" y="216" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">q</text>
  <!-- y direction reference and theta -->
  <line x1="230" y1="160" x2="230" y2="96" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M230,128 A32,32 0 0,1 248.4,133.8" fill="none" stroke="#222" stroke-width="1"/>
  <text x="234" y="122" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">θ</text>
  <!-- y_c dimension -->
  <line x1="150" y1="160" x2="228" y2="160" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="150" y1="160" x2="150" y2="250" stroke="#222" stroke-width="1" marker-start="url(#q-ak)" marker-end="url(#q-ak)"/>
  <text x="124" y="212" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">y<tspan baseline-shift="sub" font-size="10" font-style="normal" font-family="Noto Sans CJK JP, sans-serif">c</tspan></text>
  <!-- omega -->
  <path d="M276,121.4 A60,60 0 0,1 289.1,149.6" fill="none" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#q-ab)"/>
  <text x="292" y="132" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#1f5fbf">ω</text>
  <!-- u -->
  <line x1="360" y1="215" x2="360" y2="160" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#q-ab)"/>
  <text x="368" y="192" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#1f5fbf">u</text>
  <text x="320" y="236" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">（中点の速度）</text>
  <!-- y axis -->
  <line x1="510" y1="250" x2="510" y2="70" stroke="#222" stroke-width="1" marker-end="url(#q-ak)"/>
  <text x="518" y="80" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">y</text>
  <text x="518" y="258" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">0</text>
</svg>
