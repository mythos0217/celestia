<path d="M75,240 A25,25 0 0 1 87.6,218.3" fill="none" stroke="#222" stroke-width="1"/>
<text x="66" y="230" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">β</text>
<text x="112" y="225" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">船首の向き</text>
<text x="190" y="290" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">（上流 ← 　 → 下流）</text>
