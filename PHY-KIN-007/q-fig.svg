<line x1="104" y1="40" x2="376" y2="40" stroke="#222" stroke-width="1" marker-start="url(#q-ak)" marker-end="url(#q-ak)"/>
<line x1="100" y1="32" x2="100" y2="78" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
