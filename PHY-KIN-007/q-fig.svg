<!-- heading u at angle beta from upstream bank direction -->
<line x1="100" y1="240" x2="40" y2="240" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
<line x1="100" y1="240" x2="60" y2="170" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#q-ab)"/>
