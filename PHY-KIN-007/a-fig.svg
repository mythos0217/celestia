<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 370">
<defs><marker id="a-ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#1f5fbf"/></marker>
<marker id="a-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#c0392b"/></marker>
<marker id="a-ak" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#222"/></marker></defs>
<!-- origin O at (60,260), scale u=80px, v=160 -->
<line x1="40" y1="260" x2="460" y2="260" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
<line x1="60" y1="260" x2="217" y2="260" stroke="#222" stroke-width="1.8" marker-end="url(#a-ak)"/>
<text x="130" y="282" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">v</text>
<circle cx="220" cy="260" r="80" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
<text x="292" y="200" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">半径 <tspan font-family="Times New Roman, serif" font-style="italic">u</tspan></text>
<!-- target direction toward B: slope W/2W -> direction (2,-1) -->
<line x1="60" y1="260" x2="420" y2="80" stroke="#888" stroke-width="1" stroke-dasharray="6,3"/>
<text x="400" y="104" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">B の方向</text>
<!-- intersection1: beta=90: u straight up (220,180) -->
<line x1="220" y1="260" x2="220" y2="183" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#a-ab)"/>
<line x1="60" y1="260" x2="217" y2="181.5" stroke="#c0392b" stroke-width="1.8" marker-end="url(#a-ar)"/>
<!-- intersection2: beta with cos 4/5 sin 3/5: u = (-64,-48) -> (156,212) -->
<line x1="220" y1="260" x2="158" y2="213.5" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#a-ab)"/>
<line x1="60" y1="260" x2="153" y2="213.5" stroke="#c0392b" stroke-width="1.8" marker-end="url(#a-ar)"/>
<text x="226" y="200" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#1f5fbf">β=90°</text>
<text x="160" y="236" font-family="Noto Sans CJK JP, sans-serif" font-size="12" fill="#1f5fbf">sinβ=3/5</text>
<!-- tangent line (min drift), angle phi with sin = u/v = 1/2 -> 30deg -->
<line x1="60" y1="260" x2="400" y2="63.7" stroke="#222" stroke-width="1" stroke-dasharray="2,3"/>
<text x="200" y="118" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">接線（流され距離最小）</text>
<circle cx="180" cy="190.7" r="3" fill="#222"/>
<text x="40" y="362" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">赤：岸から見た速度　青：水に対する船の速度（<tspan font-family="Times New Roman, serif" font-style="italic">v</tspan>=2<tspan font-family="Times New Roman, serif" font-style="italic">u</tspan>）</text>
</svg>
