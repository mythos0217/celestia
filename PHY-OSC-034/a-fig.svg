  <text x="20" y="275" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">最高点・最低点では速度は水平（紙面に垂直）．</text>
  <text x="20" y="298" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">水平面への射影は軸に向かう中心力 → 面積速度</text>
  <text x="330" y="298" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">ρv</text>
