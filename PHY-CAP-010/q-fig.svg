<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300">
<defs><marker id="q-ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker>
<marker id="q-ar2" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 z" fill="#222"/></marker>
<marker id="q-ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f5fbf"/></marker></defs>
<!-- fixed left wall (hatched) -->
<rect x="70" y="80" width="16" height="120" fill="none" stroke="#222" stroke-width="1.6"/>
<g stroke="#222" stroke-width="1">
<line x1="70" y1="92" x2="58" y2="104"/><line x1="70" y1="112" x2="58" y2="124"/><line x1="70" y1="132" x2="58" y2="144"/><line x1="70" y1="152" x2="58" y2="164"/><line x1="70" y1="172" x2="58" y2="184"/><line x1="70" y1="192" x2="58" y2="204"/>
</g>
<!-- top plate: two overlapping sheets -->
<rect x="86" y="86" width="230" height="5" fill="none" stroke="#222" stroke-width="1.6"/>
<rect x="250" y="92" width="146" height="5" fill="none" stroke="#222" stroke-width="1.6"/>
<!-- bottom plate -->
<rect x="86" y="189" width="230" height="5" fill="none" stroke="#222" stroke-width="1.6"/>
<rect x="250" y="183" width="146" height="5" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="110" y="82" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">＋<tspan font-family="Times New Roman, serif" font-style="italic">Q</tspan></text>
<text x="110" y="212" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">−<tspan font-family="Times New Roman, serif" font-style="italic">Q</tspan></text>
<!-- movable wall W -->
<rect x="384" y="97" width="12" height="86" fill="#888" fill-opacity="0.35" stroke="#222" stroke-width="1.6"/>
<text x="402" y="146" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">W</text>
<!-- gas -->
<g fill="#222"><circle cx="130" cy="120" r="2"/><circle cx="180" cy="150" r="2"/><circle cx="240" cy="160" r="2"/><circle cx="300" cy="160" r="2"/><circle cx="340" cy="118" r="2"/><circle cx="150" cy="165" r="2"/><circle cx="270" cy="140" r="2"/><circle cx="360" cy="150" r="2"/></g>
<text x="190" y="133" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">気体（(3)(4)）</text>
<!-- p0 arrows -->
<line x1="460" y1="160" x2="404" y2="160" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#q-ab)"/>
<text x="466" y="166" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">大気 <tspan font-family="Times New Roman, serif" font-style="italic">p</tspan><tspan baseline-shift="sub" font-size="10">0</tspan></text>
<!-- d -->
<line x1="38" y1="97" x2="38" y2="183" stroke="#222" stroke-width="1" marker-start="url(#q-ar2)" marker-end="url(#q-ar)"/>
<text x="22" y="145" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">d</text>
<!-- x -->
<line x1="86" y1="240" x2="384" y2="240" stroke="#222" stroke-width="1" marker-start="url(#q-ar2)" marker-end="url(#q-ar)"/>
<line x1="384" y1="194" x2="384" y2="248" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
<text x="230" y="260" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">x</text>
<text x="70" y="285" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">極板は2枚の導体板の重ね合わせで，長さは常に <tspan font-family="Times New Roman, serif" font-style="italic">x</tspan>（幅 <tspan font-family="Times New Roman, serif" font-style="italic">a</tspan> は紙面に垂直）</text>
</svg>
