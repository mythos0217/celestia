  </defs>
  <line x1="50" y1="250" x2="530" y2="250" stroke="#222" stroke-width="1" marker-end="url(#a-ak)"/>
  <line x1="50" y1="250" x2="50" y2="30" stroke="#222" stroke-width="1" marker-end="url(#a-ak)"/>
