  <!-- レーザー振動数 ν0 = 中心 -60 (δ=γ) -->
  <line x1="320" y1="250" x2="320" y2="155" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="306" y="290" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">ν<tspan baseline-shift="sub" font-size="10">0</tspan></text>
  <!-- 見かけの振動数 -->
  <line x1="295" y1="250" x2="295" y2="186.8" stroke="#c0392b" stroke-width="1.8"/>
  <line x1="345" y1="250" x2="345" y2="108.2" stroke="#1f5fbf" stroke-width="1.8"/>
  <text x="110" y="175" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#c0392b">光 1（追いかける光）</text>
  <text x="110" y="148" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#1f5fbf">光 2（向かってくる光）</text>
