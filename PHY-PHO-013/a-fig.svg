  <!-- ローレンツ曲線 中心 x=380, 半値半幅 60px, 高さ 180px -->
  <path d="M60,243.5 L70,243.1 L80,242.7 L90,242.2 L100,241.7 L110,241.1 L120,240.4 L130,239.7 L140,238.8 L150,237.9 L160,236.8 L170,235.7 L180,234.3 L190,232.8 L200,231.0 L210,229.0 L220,226.6 L230,223.8 L240,220.5 L250,216.6 L260,212.0 L270,206.4 L280,199.7 L290,191.5 L300,181.6 L310,169.5 L320,155.0 L330,137.9 L340,118.5 L350,98.0 L360,79.0 L370,65.1 L380,60.0 L390,65.1 L400,79.0 L410,98.0 L420,118.5 L430,137.9 L440,155.0 L450,169.5 L460,181.6 L470,191.5 L480,199.7 L490,206.4 L500,212.0 L510,216.6 L520,220.5" fill="none" stroke="#222" stroke-width="1.6"/>
