<path d="M110,190 A40,40 0 0 1 134,198" fill="none" stroke="#222" stroke-width="1"/>
<text x="114" y="184" font-family="Times New Roman, serif" font-style="italic" font-size="14" fill="#222">φ</text>
<text x="172" y="168" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">P</text>
<!-- Q spring tilted backward: from ceiling (250,30) direction (-0.6,0.8) -->
<line x1="250" y1="30" x2="214" y2="78" stroke="#222" stroke-width="1.4"/>
<circle cx="207" cy="88" r="11" fill="#222" fill-opacity="0.15" stroke="#222" stroke-width="1.6"/>
<line x1="250" y1="30" x2="250" y2="100" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
<text x="185" y="92" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">Q</text>
<!-- apparent gravity vector -->
<line x1="380" y1="60" x2="380" y2="140" stroke="#222" stroke-width="1.8" marker-end="url(#a-ak)"/>
<line x1="380" y1="140" x2="320" y2="140" stroke="#222" stroke-width="1.8" marker-end="url(#a-ak)"/>
<line x1="380" y1="60" x2="322" y2="137" stroke="#c0392b" stroke-width="1.8" marker-end="url(#a-ar)"/>
<text x="386" y="104" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">g</text>
<text x="344" y="160" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">a</text>
<text x="310" y="82" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#c0392b">g′</text>
<text x="318" y="190" font-family="Noto Sans CJK JP, sans-serif" font-size="12" fill="#c0392b">見かけの重力</text>
<text x="318" y="206" font-family="Noto Sans CJK JP, sans-serif" font-size="12" fill="#222">（容器の系）</text>
<line x1="40" y1="258" x2="110" y2="258" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#a-ab)"/>
<text x="120" y="263" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#1f5fbf">容器の加速度 <tspan font-family="Times New Roman, serif" font-style="italic">a</tspan></text>
</svg>
