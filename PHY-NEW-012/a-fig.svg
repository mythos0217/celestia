<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280">
<defs><marker id="a-ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#1f5fbf"/></marker>
<marker id="a-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#c0392b"/></marker>
<marker id="a-ak" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#222"/></marker></defs>
<rect x="40" y="30" width="260" height="200" fill="none" stroke="#222" stroke-width="2.2"/>
<!-- tan phi = 3/4 : direction forward-up (0.6,-0.8) -->
<line x1="110" y1="230" x2="152" y2="174" stroke="#222" stroke-width="1"/>
<circle cx="158" cy="166" r="11" fill="none" stroke="#222" stroke-width="1.6"/>
