<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330">
  <defs>
    <marker id="q-ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <pattern id="q-hp" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#888" stroke-width="1"/></pattern>
    <g id="q-dot"><circle cx="0" cy="0" r="7" fill="none" stroke="#222" stroke-width="1.1"/><circle cx="0" cy="0" r="2" fill="#222"/></g>
  </defs>
  <!-- rails -->
  <g stroke="#222" stroke-width="2.2">
    <line x1="145" y1="100" x2="280" y2="100"/><line x1="145" y1="200" x2="280" y2="200"/>
    <line x1="400" y1="100" x2="560" y2="100"/><line x1="400" y1="200" x2="560" y2="200"/>
  </g>
  <!-- plate and arm -->
  <rect x="220" y="128" width="250" height="44" fill="url(#q-hp)" stroke="#222" stroke-width="1.2"/>
  <rect x="343" y="172" width="14" height="86" fill="none" stroke="#222" stroke-width="1.2"/>
  <!-- rods -->
  <g stroke="#222" stroke-width="5" stroke-linecap="round">
    <line x1="220" y1="88" x2="220" y2="212"/><line x1="470" y1="88" x2="470" y2="212"/>
  </g>
  <!-- spring and wall -->
  <polyline points="357,265 375,265 383,253 397,277 411,253 425,277 439,253 453,277 467,253 481,277 489,265 520,265" fill="none" stroke="#222" stroke-width="1.6"/>
  <line x1="343" y1="258" x2="357" y2="258" stroke="#222" stroke-width="1.2"/>
  <line x1="350" y1="258" x2="350" y2="265" stroke="#222" stroke-width="1.2"/>
  <line x1="350" y1="265" x2="357" y2="265" stroke="#222" stroke-width="1.6"/>
  <line x1="520" y1="240" x2="520" y2="290" stroke="#222" stroke-width="1.6"/>
  <g stroke="#222" stroke-width="1">
    <line x1="520" y1="244" x2="530" y2="236"/><line x1="520" y1="254" x2="530" y2="246"/><line x1="520" y1="264" x2="530" y2="256"/><line x1="520" y1="274" x2="530" y2="266"/><line x1="520" y1="284" x2="530" y2="276"/>
  </g>
  <!-- left circuit -->
  <g stroke="#222" stroke-width="1.6" fill="none">
    <line x1="145" y1="100" x2="100" y2="100"/><line x1="100" y1="100" x2="100" y2="110"/>
    <rect x="90" y="110" width="20" height="40"/>
    <line x1="100" y1="150" x2="100" y2="160"/>
    <line x1="100" y1="160" x2="80" y2="183"/>
    <circle cx="78" cy="188" r="3.5"/><circle cx="122" cy="188" r="3.5"/>
    <line x1="78" y1="192" x2="78" y2="203"/>
    <line x1="69" y1="203" x2="87" y2="203" stroke-width="3.2"/>
    <line x1="62" y1="213" x2="94" y2="213"/>
    <line x1="78" y1="213" x2="78" y2="240"/>
    <line x1="122" y1="192" x2="122" y2="240"/>
    <line x1="78" y1="240" x2="145" y2="240"/>
    <line x1="145" y1="200" x2="145" y2="240"/>
  </g>
  <circle cx="100" cy="160" r="2.5" fill="#222"/>
  <!-- right circuit -->
  <g stroke="#222" stroke-width="1.6" fill="none">
    <line x1="560" y1="100" x2="590" y2="100"/><line x1="590" y1="100" x2="590" y2="110"/>
    <rect x="580" y="110" width="20" height="40"/>
    <line x1="590" y1="150" x2="590" y2="162"/>
    <circle cx="590" cy="165" r="3"/>
    <line x1="590" y1="192" x2="574" y2="170"/>
    <circle cx="590" cy="195" r="3"/>
    <line x1="590" y1="198" x2="590" y2="200"/>
    <line x1="560" y1="200" x2="590" y2="200"/>
  </g>
  <!-- B symbols -->
  <use href="#q-dot" x="170" y="60"/><use href="#q-dot" x="340" y="60"/><use href="#q-dot" x="520" y="60"/><use href="#q-dot" x="195" y="128"/><use href="#q-dot" x="520" y="150"/>
  <!-- l dimension -->
  <g stroke="#888" stroke-width="1" stroke-dasharray="4,3"><line x1="168" y1="100" x2="168" y2="200"/></g>
  <!-- x axis -->
  <line x1="200" y1="305" x2="270" y2="305" stroke="#222" stroke-width="1.2" marker-end="url(#q-ax)"/>
  <g font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">
    <text x="147" y="92">P</text><text x="150" y="222">P′</text>
    <text x="400" y="92">Q</text><text x="400" y="222">Q′</text>
    <text x="212" y="80">M</text><text x="462" y="80">N</text>
    <text x="66" y="182" font-size="13">a</text><text x="128" y="180" font-size="13">b</text>
    <text x="540" y="312" font-size="12">（固定）</text>
    <text x="262" y="122" font-size="12">絶縁体の板</text>
    <text x="356" y="56" font-size="12">鉛直上向きの磁場</text>
  </g>
  <g font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">
    <text x="70" y="136">R</text>
    <text x="42" y="216">E</text>
    <text x="604" y="136">r</text>
    <text x="173" y="182">l</text>
    <text x="440" y="300">k</text>
    <text x="274" y="310">x</text>
    <text x="354" y="78">B</text>
    <text x="30" y="172">S<tspan baseline-shift="sub" font-size="10" font-style="normal">1</tspan></text>
    <text x="602" y="186">S<tspan baseline-shift="sub" font-size="10" font-style="normal">2</tspan></text>
  </g>
</svg>
