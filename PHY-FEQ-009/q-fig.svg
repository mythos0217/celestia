<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
<defs><marker id="q-ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f5fbf"/></marker></defs>
<!-- Fig1: wall -->
<line x1="40" y1="60" x2="40" y2="150" stroke="#222" stroke-width="1.6"/>
<g stroke="#222" stroke-width="1">
<line x1="40" y1="66" x2="30" y2="76"/><line x1="40" y1="82" x2="30" y2="92"/><line x1="40" y1="98" x2="30" y2="108"/><line x1="40" y1="114" x2="30" y2="124"/><line x1="40" y1="130" x2="30" y2="140"/></g>
