<line x1="175" y1="160" x2="315" y2="160" stroke="#222" stroke-width="1"/>
<text x="240" y="155" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">d</text>
<text x="80" y="230" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">図1（ばね定数 <tspan font-family="Times New Roman, serif" font-style="italic">k</tspan>，飛びつく直前）</text>
