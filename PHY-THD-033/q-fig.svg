<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330">
<defs>
<marker id="q-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#222"/></marker>
<marker id="q-bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#1f5fbf"/></marker>
<marker id="q-rd" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#c0392b"/></marker>
</defs>
<!-- PV diagram -->
<line x1="50" y1="280" x2="300" y2="280" stroke="#222" stroke-width="1" marker-end="url(#q-ar)"/>
<line x1="50" y1="280" x2="50" y2="30" stroke="#222" stroke-width="1" marker-end="url(#q-ar)"/>
<text x="302" y="296" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">V</text>
<text x="34" y="34" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">p</text>
<text x="40" y="298" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">O</text>
<!-- V1=100, V2=250 ; TH isotherm p=11000/V ; TL isotherm p=5500/V (pixel heights) -->
<path d="M100,170 Q150,205 175,221 Q215,240 250,236" fill="none" stroke="#222" stroke-width="1.6"/>
<path d="M100,60 Q160,118 200,135 Q230,145 250,148" fill="none" stroke="#222" stroke-width="1.6"/>
<line x1="250" y1="148" x2="250" y2="236" stroke="#222" stroke-width="1.6"/>
