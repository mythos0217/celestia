<path d="M165,111 L178,118" stroke="#222" stroke-width="1.6" marker-end="url(#q-ar)"/>
<path d="M250,185 L250,198" stroke="#222" stroke-width="1.6" marker-end="url(#q-ar)"/>
<path d="M190,229 L176,222" stroke="#222" stroke-width="1.6" marker-end="url(#q-ar)"/>
<path d="M100,122 L100,108" stroke="#222" stroke-width="1.6" marker-end="url(#q-ar)"/>
<text x="86" y="58" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">A</text>
<text x="256" y="146" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">B</text>
<text x="256" y="246" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">C</text>
<text x="84" y="182" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">D</text>
<text x="185" y="110" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">T<tspan baseline-shift="sub" font-size="10">H</tspan></text>
<text x="150" y="240" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">T<tspan baseline-shift="sub" font-size="10">L</tspan></text>
<line x1="100" y1="170" x2="100" y2="280" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
<line x1="250" y1="236" x2="250" y2="280" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
<text x="92" y="300" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">V<tspan baseline-shift="sub" font-size="10">1</tspan></text>
<text x="242" y="300" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">V<tspan baseline-shift="sub" font-size="10">2</tspan></text>
<!-- schematic of contacts -->
<text x="340" y="40" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">B→C（体積 <tspan font-family="Times New Roman, serif" font-style="italic">V</tspan><tspan baseline-shift="sub" font-size="10">2</tspan>）</text>
<rect x="340" y="55" width="70" height="40" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="356" y="80" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">気体</text>
<line x1="412" y1="75" x2="438" y2="75" stroke="#c0392b" stroke-width="1.8" marker-end="url(#q-rd)"/>
<rect x="440" y="55" width="60" height="40" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="446" y="72" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">蓄熱器</text>
<text x="456" y="89" font-family="Times New Roman, serif" font-style="italic" font-size="14" fill="#222">K</text>
<text x="508" y="80" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">→ 低温熱源</text>
<text x="340" y="150" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">D→A（体積 <tspan font-family="Times New Roman, serif" font-style="italic">V</tspan><tspan baseline-shift="sub" font-size="10">1</tspan>）</text>
<rect x="340" y="165" width="70" height="40" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="356" y="190" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">気体</text>
<line x1="438" y1="185" x2="414" y2="185" stroke="#c0392b" stroke-width="1.8" marker-end="url(#q-rd)"/>
<rect x="440" y="165" width="60" height="40" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="446" y="182" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">蓄熱器</text>
<text x="456" y="199" font-family="Times New Roman, serif" font-style="italic" font-size="14" fill="#222">K</text>
<text x="508" y="190" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">→ 高温熱源</text>
<text x="340" y="250" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">いずれも，まず蓄熱器と同じ温度になる</text>
<text x="340" y="270" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">まで熱をやりとりし，その後に熱源で</text>
<text x="340" y="290" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">目標の温度にする．</text>
</svg>
