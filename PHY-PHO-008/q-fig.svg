<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360">
  <defs>
    <marker id="q-ak" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222"/></marker>
    <marker id="q-ab" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1f5fbf"/></marker>
  </defs>
  <!-- atom cloud -->
  <g fill="#222"><circle cx="236" cy="40" r="2"/><circle cx="243" cy="36" r="2"/><circle cx="240" cy="44" r="2"/><circle cx="247" cy="42" r="2"/><circle cx="233" cy="46" r="2"/><circle cx="245" cy="48" r="2"/></g>
  <text x="258" y="40" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">静止した原子の集団（質量 <tspan font-family="Times New Roman, serif" font-style="italic">m</tspan>）</text>
  <line x1="240" y1="52" x2="240" y2="330" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
  <!-- double slit -->
  <g stroke="#222" stroke-width="3"><line x1="120" y1="150" x2="232" y2="150"/><line x1="236" y1="150" x2="244" y2="150"/><line x1="248" y1="150" x2="360" y2="150"/></g>
  <text x="368" y="155" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">二重スリット</text>
  <line x1="234" y1="160" x2="234" y2="170" stroke="#888" stroke-width="1"/><line x1="246" y1="160" x2="246" y2="170" stroke="#888" stroke-width="1"/>
  <text x="250" y="174" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">d</text>
  <!-- screen -->
  <rect x="100" y="300" width="280" height="6" fill="none" stroke="#222" stroke-width="1.6"/>
  <text x="388" y="308" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">スクリーン</text>
  <g fill="#222"><rect x="236" y="296" width="8" height="3"/><rect x="214" y="296" width="8" height="3"/><rect x="258" y="296" width="8" height="3"/><rect x="192" y="296" width="8" height="3"/><rect x="280" y="296" width="8" height="3"/></g>
  <!-- x axis on screen -->
  <line x1="240" y1="330" x2="400" y2="330" stroke="#222" stroke-width="1" marker-end="url(#q-ak)"/>
  <text x="404" y="335" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">x</text>
  <text x="232" y="350" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">0</text>
  <!-- dimensions -->
  <g stroke="#888" stroke-width="1"><line x1="80" y1="40" x2="80" y2="148"/><line x1="80" y1="152" x2="80" y2="300"/><line x1="72" y1="40" x2="226" y2="40" stroke-dasharray="3 3"/><line x1="72" y1="150" x2="118" y2="150" stroke-dasharray="3 3"/><line x1="72" y1="300" x2="98" y2="300" stroke-dasharray="3 3"/></g>
  <text x="60" y="100" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">H</text>
  <text x="64" y="230" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">l</text>
  <!-- gravity -->
  <line x1="420" y1="190" x2="420" y2="240" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#q-ab)"/>
  <text x="428" y="222" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#1f5fbf">g</text>
</svg>
