<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330">
<defs>
<marker id="a-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
<marker id="a-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
</defs>
<text x="20" y="28" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">放した瞬間（地面から見た速度：青，重心系での速度：赤）</text>
<!-- string -->
<line x1="120" y1="190" x2="380" y2="190" stroke="#222" stroke-width="1.6"/>
<circle cx="120" cy="190" r="9" fill="#222"/>
<circle cx="380" cy="190" r="10" fill="#222"/>
<circle cx="207" cy="190" r="5" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="98" y="218" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">B</text>
<text x="390" y="218" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">A</text>
<text x="200" y="218" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">G</text>
<!-- ground velocity of A -->
<line x1="380" y1="178" x2="380" y2="70" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#a-ab)"/>
<text x="352" y="70" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#1f5fbf">u</text>
<!-- CM velocity -->
<line x1="207" y1="183" x2="207" y2="146" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#a-ab)"/>
<text x="148" y="140" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#1f5fbf">V<tspan baseline-shift="sub" font-size="10" font-style="normal">G</tspan><tspan font-style="normal">＝</tspan></text>
<text x="186" y="140" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#1f5fbf">mu/(m+M)</text>
<!-- CM-frame velocity of A and B -->
<line x1="400" y1="190" x2="400" y2="112" stroke="#c0392b" stroke-width="1.8" marker-end="url(#a-ar)"/>
<text x="408" y="130" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#c0392b">Mu/(m+M)</text>
<line x1="120" y1="202" x2="120" y2="248" stroke="#c0392b" stroke-width="1.8" marker-end="url(#a-ar)"/>
<text x="130" y="248" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#c0392b">mu/(m+M)</text>
<!-- rotation circle in CM frame -->
<text x="250" y="300" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">重心系：角速度</text>
<text x="352" y="300" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">u/l</text>
<text x="380" y="300" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">の等速円運動，張力一定</text>
<text x="20" y="300" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">G：加速度</text>
<text x="92" y="300" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">g</text>
<text x="104" y="300" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">の投げ上げ</text>
</svg>
