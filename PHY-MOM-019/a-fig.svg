<marker id="a-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<line x1="50" y1="190" x2="400" y2="190" stroke="#222" stroke-width="1.2" marker-end="url(#a-ak)"/>
<text x="406" y="195" font-family="Times New Roman, serif" font-style="italic" font-size="14" fill="#222" text-anchor="start">X = √m v</text>
