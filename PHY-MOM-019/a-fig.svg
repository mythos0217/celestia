<line x1="220" y1="190" x2="302.5" y2="47.10580837556762" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
<text x="308.5" y="51.10580837556762" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222" text-anchor="start">n</text>
<path d="M220,145 A45,45 0 0,1 242.5,151.0" fill="none" stroke="#888"/><text x="232" y="138" font-family="Times New Roman, serif" font-style="italic" font-size="14" fill="#222" text-anchor="middle">θ</text>
<circle cx="107.4" cy="125.0" r="4" fill="#c0392b"/><circle cx="332.6" cy="125.0" r="4" fill="#c0392b"/><circle cx="220.0" cy="60.0" r="4" fill="#c0392b"/><line x1="107.4" y1="125.0" x2="326.6" y2="125.0" stroke="#1f5fbf" stroke-width="1.6" marker-end="url(#a-ab)"/><line x1="332.6" y1="125.0" x2="225.0" y2="64.0" stroke="#1f5fbf" stroke-width="1.6" marker-end="url(#a-ab)"/><text x="101.41669750802298" y="116.99999999999999" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222" text-anchor="end">下り終え ψ₀</text>
