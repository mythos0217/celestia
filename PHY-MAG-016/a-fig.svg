<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 460">
  <defs>
    <marker id="a-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
    <marker id="a-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="a-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
  </defs>
  <g transform="translate(0,30)">
  <!-- axes: P at (240,230), R=120px -->
  <line x1="30" y1="230" x2="460" y2="230" stroke="#222" stroke-width="1" marker-end="url(#a-ak)"/>
  <text x="448" y="250" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">x</text>
  <line x1="240" y1="400" x2="240" y2="40" stroke="#888" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#a-ak)"/>
  <text x="248" y="50" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">y</text>
  <!-- C original circle -->
  <circle cx="240" cy="110" r="120" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="352" y="60" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#888">C のもとの円</text>
  <circle cx="240" cy="110" r="3" fill="#222"/>
  <text x="248" y="106" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">O</text>
  <!-- F circle, v=V/2: centre (0,R/2) -->
  <circle cx="240" cy="170" r="60" fill="none" stroke="#1f5fbf" stroke-width="1.8"/>
  <circle cx="240" cy="170" r="2.5" fill="#1f5fbf"/>
  <path d="M 300 170 A 60 60 0 0 1 282 212" fill="none" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#a-ab)"/>
  <line x1="236" y1="236" x2="205" y2="236" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#a-ab)"/>
  <text x="60" y="160" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#1f5fbf"><tspan font-family="Times New Roman, serif" font-style="italic">v</tspan> = <tspan font-family="Times New Roman, serif" font-style="italic">V</tspan>/2 のとき</text>
  <text x="60" y="178" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#1f5fbf">中心 (0, <tspan font-family="Times New Roman, serif" font-style="italic">R</tspan>/2)，O を通る</text>
  <!-- F circle, v=3V/2: centre (0,-R/2) -->
  <circle cx="240" cy="290" r="60" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="7,4"/>
  <circle cx="240" cy="290" r="2.5" fill="#c0392b"/>
  <path d="M 180 290 A 60 60 0 0 1 198 248" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#a-ar)"/>
  <line x1="244" y1="224" x2="275" y2="224" stroke="#c0392b" stroke-width="1.8" marker-end="url(#a-ar)"/>
  <text x="310" y="320" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#c0392b"><tspan font-family="Times New Roman, serif" font-style="italic">v</tspan> = 3<tspan font-family="Times New Roman, serif" font-style="italic">V</tspan>/2 のとき</text>
  <text x="310" y="338" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#c0392b">中心 (0, −<tspan font-family="Times New Roman, serif" font-style="italic">R</tspan>/2)</text>
  <circle cx="240" cy="230" r="3" fill="#222"/>
  <text x="222" y="250" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">P</text>
  <text x="120" y="410" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">F はどちらも上から見て時計回り（半径 <tspan font-family="Times New Roman, serif" font-style="italic">R</tspan>/2）</text>
  </g>
</svg>
