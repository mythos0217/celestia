<text x="150" y="290" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">体積 <tspan font-family="Times New Roman, serif" font-style="italic">V</tspan><tspan baseline-shift="sub" font-size="10">0</tspan>，温度 <tspan font-family="Times New Roman, serif" font-style="italic">T</tspan><tspan baseline-shift="sub" font-size="10">A</tspan></text>
