<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400">
  <defs>
    <marker id="q-ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker>
    <pattern id="q-dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="#888"/><circle cx="8" cy="8" r="1.1" fill="#888"/></pattern>
  </defs>
  <!-- left panel: free piston -->
  <text x="150" y="28" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222" text-anchor="middle">(1)〜(4)</text>
  <line x1="90" y1="50" x2="90" y2="340" stroke="#222" stroke-width="1.6"/>
  <line x1="210" y1="50" x2="210" y2="340" stroke="#222" stroke-width="1.6"/>
  <line x1="90" y1="340" x2="210" y2="340" stroke="#222" stroke-width="1.6"/>
  <text x="150" y="75" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222" text-anchor="middle">真空</text>
  <!-- gas -->
  <rect x="91" y="152" width="118" height="187" fill="url(#q-dots)" opacity="0.8"/>
  <!-- piston -->
  <rect x="91" y="140" width="118" height="12" fill="#ccc" stroke="#222" stroke-width="1.6"/>
  <text x="150" y="133" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222" text-anchor="middle">M</text>
  <text x="150" y="250" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222" text-anchor="middle">N, m, T</text>
  <!-- heater -->
  <path d="M110,330 l8,-8 l8,8 l8,-8 l8,8 l8,-8 l8,8 l8,-8 l8,8 l8,-8 l8,8" fill="none" stroke="#c0392b" stroke-width="1.4"/>
  <text x="150" y="362" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222" text-anchor="middle">ヒーター（底面）</text>
  <!-- floor hatch -->
  <g stroke="#222" stroke-width="1">
    <line x1="80" y1="340" x2="220" y2="340"/>
    <line x1="85" y1="340" x2="77" y2="348"/><line x1="100" y1="340" x2="92" y2="348"/><line x1="115" y1="340" x2="107" y2="348"/><line x1="130" y1="340" x2="122" y2="348"/><line x1="145" y1="340" x2="137" y2="348"/><line x1="160" y1="340" x2="152" y2="348"/><line x1="175" y1="340" x2="167" y2="348"/><line x1="190" y1="340" x2="182" y2="348"/><line x1="205" y1="340" x2="197" y2="348"/><line x1="220" y1="340" x2="212" y2="348"/>
  </g>
  <!-- h dimension -->
  <line x1="235" y1="152" x2="235" y2="340" stroke="#888" stroke-width="1" stroke-dasharray="4 3" marker-start="url(#q-ar)" marker-end="url(#q-ar)"/>
  <text x="243" y="250" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">h</text>
  <!-- z axis -->
  <line x1="55" y1="340" x2="55" y2="60" stroke="#222" stroke-width="1" marker-end="url(#q-ar)"/>
  <text x="44" y="62" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">z</text>
  <text x="38" y="345" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">0</text>
  <text x="150" y="388" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222" text-anchor="middle">断面積 <tspan font-family="Times New Roman, serif" font-style="italic">S</tspan></text>

  <!-- right panel: fixed lid -->
  <text x="420" y="28" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222" text-anchor="middle">(5)</text>
  <line x1="360" y1="50" x2="360" y2="340" stroke="#222" stroke-width="1.6"/>
  <line x1="480" y1="50" x2="480" y2="340" stroke="#222" stroke-width="1.6"/>
  <line x1="360" y1="340" x2="480" y2="340" stroke="#222" stroke-width="1.6"/>
  <rect x="361" y="118" width="118" height="221" fill="url(#q-dots)" opacity="0.8"/>
  <rect x="361" y="106" width="118" height="12" fill="#ccc" stroke="#222" stroke-width="1.6"/>
  <!-- stoppers -->
  <rect x="352" y="96" width="9" height="32" fill="#222"/>
  <rect x="479" y="96" width="9" height="32" fill="#222"/>
  <text x="420" y="88" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222" text-anchor="middle">固定</text>
  <text x="420" y="240" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222" text-anchor="middle">N, m, T</text>
  <path d="M380,330 l8,-8 l8,8 l8,-8 l8,8 l8,-8 l8,8 l8,-8 l8,8 l8,-8 l8,8" fill="none" stroke="#c0392b" stroke-width="1.4"/>
  <g stroke="#222" stroke-width="1">
    <line x1="350" y1="340" x2="490" y2="340"/>
    <line x1="355" y1="340" x2="347" y2="348"/><line x1="370" y1="340" x2="362" y2="348"/><line x1="385" y1="340" x2="377" y2="348"/><line x1="400" y1="340" x2="392" y2="348"/><line x1="415" y1="340" x2="407" y2="348"/><line x1="430" y1="340" x2="422" y2="348"/><line x1="445" y1="340" x2="437" y2="348"/><line x1="460" y1="340" x2="452" y2="348"/><line x1="475" y1="340" x2="467" y2="348"/><line x1="490" y1="340" x2="482" y2="348"/>
  </g>
  <line x1="505" y1="118" x2="505" y2="340" stroke="#888" stroke-width="1" stroke-dasharray="4 3" marker-start="url(#q-ar)" marker-end="url(#q-ar)"/>
  <text x="513" y="235" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">H</text>
</svg>
