<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260">
  <defs>
    <marker id="q-ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#1f5fbf"/></marker>
  </defs>
  <!-- plates -->
  <line x1="200" y1="90" x2="380" y2="90" stroke="#222" stroke-width="3"/>
  <line x1="200" y1="150" x2="380" y2="150" stroke="#222" stroke-width="3"/>
  <!-- dielectric slab (partly withdrawn) -->
  <rect x="260" y="93" width="190" height="54" fill="#888" fill-opacity="0.35" stroke="#222" stroke-width="1.6"/>
  <text x="300" y="126" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">誘電体 <tspan font-family="Times New Roman, serif" font-style="italic">ε</tspan><tspan baseline-shift="sub" font-size="10">r</tspan></text>
  <line x1="460" y1="120" x2="505" y2="120" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#q-ar)"/>
  <text x="440" y="170" font-family="Noto Sans CJK JP, sans-serif" font-size="12" fill="#222">一定の速さで</text>
  <text x="440" y="186" font-family="Noto Sans CJK JP, sans-serif" font-size="12" fill="#222">引き抜く</text>
  <!-- wires -->
  <polyline points="290,90 290,40 80,40 80,95" fill="none" stroke="#222" stroke-width="1.4"/>
  <polyline points="150,210 80,210 80,145" fill="none" stroke="#222" stroke-width="1.4"/>
  <polyline points="190,210 290,210 290,150" fill="none" stroke="#222" stroke-width="1.4"/>
  <rect x="68" y="95" width="24" height="50" fill="none" stroke="#222" stroke-width="1.6"/>
  <text x="40" y="126" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">R</text>
  <!-- switch on bottom wire -->
  <text x="170" y="232" font-family="Noto Sans CJK JP, sans-serif" font-size="12" fill="#222">時刻 0 に接続</text>
  <circle cx="150" cy="210" r="2.5" fill="#222"/><circle cx="190" cy="210" r="2.5" fill="#222"/>
  <line x1="150" y1="210" x2="186" y2="196" stroke="#222" stroke-width="1.4"/>
  <text x="385" y="80" font-family="Noto Sans CJK JP, sans-serif" font-size="12" fill="#222">はじめの電圧 <tspan font-family="Times New Roman, serif" font-style="italic">V</tspan><tspan baseline-shift="sub" font-size="10">0</tspan></text>
  <text x="200" y="20" font-family="Noto Sans CJK JP, sans-serif" font-size="12" fill="#222">（図は引き抜いている途中のようす）</text>
</svg>
