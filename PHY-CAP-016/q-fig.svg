<line x1="80" y1="216" x2="340" y2="216" stroke="#222" stroke-width="1.2" stroke-dasharray="2 3"/>
<g font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">
<text x="96" y="229" >− − − − − − − − − − − − − − − − − − − − − </text>
</g>
<text x="190" y="252" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">誘電体（誘電率 <tspan font-family="Times New Roman, serif" font-style="italic">ε</tspan>）</text>
<!-- upper electrode -->
<rect x="80" y="122" width="260" height="6" fill="#222"/>
<text x="150" y="112" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">上電極（面積 <tspan font-family="Times New Roman, serif" font-style="italic">S</tspan>）</text>
<text x="150" y="295" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">下電極</text>
<text x="100" y="175" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">真空</text>
<!-- dims -->
<line x1="60" y1="128" x2="60" y2="212" stroke="#222" stroke-width="1" marker-start="url(#q-ah)" marker-end="url(#q-ah)"/>
<text x="44" y="175" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">z</text>
<line x1="60" y1="212" x2="60" y2="262" stroke="#222" stroke-width="1" marker-start="url(#q-ah)" marker-end="url(#q-ah)"/>
<text x="44" y="242" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">d</text>
<line x1="60" y1="212" x2="80" y2="212" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
<!-- fixed charge label -->
<line x1="300" y1="217" x2="285" y2="196" stroke="#222" stroke-width="1"/>
<text x="225" y="190" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">固定電荷 −<tspan font-family="Times New Roman, serif" font-style="italic">Q</tspan></text>
<!-- circuit -->
<polyline points="340,125 460,125 460,150" fill="none" stroke="#222" stroke-width="1.6"/>
<rect x="450" y="150" width="20" height="44" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="478" y="178" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">R</text>
<line x1="460" y1="194" x2="460" y2="212" stroke="#222" stroke-width="1.6"/>
<circle cx="460" cy="214" r="2.5" fill="#fff" stroke="#222" stroke-width="1.2"/>
<line x1="460" y1="216" x2="480" y2="238" stroke="#222" stroke-width="1.6"/>
