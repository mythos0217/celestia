<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 85 520 225">
<defs><marker id="q-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<!-- floor -->
<line x1="40" y1="270" x2="400" y2="270" stroke="#222" stroke-width="1.6"/>
<g stroke="#222" stroke-width="1">
<line x1="50" y1="270" x2="40" y2="282"/><line x1="70" y1="270" x2="60" y2="282"/><line x1="90" y1="270" x2="80" y2="282"/><line x1="110" y1="270" x2="100" y2="282"/><line x1="130" y1="270" x2="120" y2="282"/><line x1="150" y1="270" x2="140" y2="282"/><line x1="170" y1="270" x2="160" y2="282"/><line x1="190" y1="270" x2="180" y2="282"/><line x1="210" y1="270" x2="200" y2="282"/><line x1="230" y1="270" x2="220" y2="282"/><line x1="250" y1="270" x2="240" y2="282"/><line x1="270" y1="270" x2="260" y2="282"/><line x1="290" y1="270" x2="280" y2="282"/><line x1="310" y1="270" x2="300" y2="282"/><line x1="330" y1="270" x2="320" y2="282"/><line x1="350" y1="270" x2="340" y2="282"/><line x1="370" y1="270" x2="360" y2="282"/><line x1="390" y1="270" x2="380" y2="282"/>
</g>
<!-- lower electrode -->
<rect x="80" y="262" width="260" height="6" fill="#222"/>
