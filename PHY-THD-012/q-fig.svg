<path d="M180,190 L180,236 M206,190 L206,236 M180,190 L206,190" fill="none" stroke="#222" stroke-width="1.6"/>
<line x1="180" y1="217" x2="206" y2="217" stroke="#222" stroke-width="1"/>
<text x="182" y="208" font-family="Noto Sans CJK JP, sans-serif" font-size="11" fill="#222">空気</text>
<text x="214" y="200" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">浮沈子（質量</text>
<text x="300" y="200" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">m</text>
<text x="312" y="200" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">）</text>
