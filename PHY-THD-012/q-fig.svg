<marker id="q-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<pattern id="q-wv" width="24" height="12" patternUnits="userSpaceOnUse"><path d="M0,6 q6,-4 12,0 t12,0" fill="none" stroke="#888" stroke-width="0.6"/></pattern>
</defs>
<!-- liquid -->
<path d="M102,92 H298 V340 H102 Z M178,186 H208 V217 H178 Z" fill="url(#q-wv)" fill-rule="evenodd"/>
