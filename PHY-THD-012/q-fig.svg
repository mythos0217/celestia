<line x1="56" y1="92" x2="100" y2="92" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
<text x="42" y="222" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">H</text>
<text x="306" y="300" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">液体（密度</text>
<text x="378" y="300" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">ρ</text>
