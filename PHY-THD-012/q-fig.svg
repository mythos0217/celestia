<line x1="200" y1="76" x2="200" y2="40" stroke="#222" stroke-width="1.6"/>
<line x1="200" y1="22" x2="200" y2="48" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#q-ah)"/>
<text x="208" y="34" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">押す力を調節</text>
<text x="306" y="88" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">ピストン</text>
