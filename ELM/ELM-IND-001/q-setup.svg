</g>
<text x="188" y="110" font-size="15" text-anchor="middle" dominant-baseline="middle" class="f-label" fill="currentColor" font-style="italic">l</text>
<text x="130" y="28" font-size="11" text-anchor="middle" dominant-baseline="middle" class="f-label" fill="currentColor">磁場 B（紙面の裏から表の向き）</text>
