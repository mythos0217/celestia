<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340">
  <defs>
    <marker id="q-ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="q-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
    <marker id="q-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <!-- electrode Q (bottom, hidden) -->
  <polygon points="200,230 360,230 420,188 260,188" fill="#888" fill-opacity="0.15" stroke="#888" stroke-width="1" stroke-dasharray="5,4"/>
  <!-- duct -->
  <g stroke="#222" stroke-width="1.6" fill="none">
    <rect x="60" y="150" width="420" height="80"/>
    <polyline points="60,150 120,108 540,108 480,150"/>
    <polyline points="540,108 540,188 480,230"/>
  </g>
  <!-- electrode P (top) -->
  <polygon points="200,150 360,150 420,108 260,108" fill="#888" fill-opacity="0.35" stroke="#222" stroke-width="1.6"/>
  <line x1="200" y1="230" x2="360" y2="230" stroke="#222" stroke-width="3.2"/>
  <!-- B arrows (+y : oblique into page) -->
  <g stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#q-ab)">
    <line x1="235" y1="205" x2="275" y2="177"/>
    <line x1="300" y1="205" x2="340" y2="177"/>
  </g>
  <!-- flow -->
  <g stroke="#c0392b" stroke-width="1.8" marker-end="url(#q-ar)">
    <line x1="80" y1="190" x2="150" y2="190"/>
    <line x1="400" y1="215" x2="460" y2="215"/>
  </g>
  <!-- wires -->
  <g stroke="#222" stroke-width="1.6" fill="none">
    <line x1="320" y1="130" x2="320" y2="40"/>
    <line x1="320" y1="40" x2="560" y2="40"/>
    <line x1="340" y1="230" x2="340" y2="300"/>
    <line x1="340" y1="300" x2="560" y2="300"/>
    <circle cx="564" cy="40" r="4"/>
    <circle cx="564" cy="300" r="4"/>
  </g>
  <circle cx="320" cy="130" r="3" fill="#222"/>
  <circle cx="340" cy="230" r="3" fill="#222"/>
  <!-- dimension marks -->
  <g stroke="#888" stroke-width="1" fill="none">
    <line x1="200" y1="246" x2="360" y2="246"/>
    <line x1="200" y1="240" x2="200" y2="252"/><line x1="360" y1="240" x2="360" y2="252"/>
    <line x1="44" y1="150" x2="44" y2="230"/>
    <line x1="38" y1="150" x2="50" y2="150"/><line x1="38" y1="230" x2="50" y2="230"/>
    <line x1="490" y1="232" x2="550" y2="190"/>
  </g>
  <!-- axes -->
  <g stroke="#222" stroke-width="1.2" marker-end="url(#q-ax)">
    <line x1="60" y1="310" x2="110" y2="310"/>
    <line x1="60" y1="310" x2="60" y2="262"/>
    <line x1="60" y1="310" x2="94" y2="286"/>
  </g>
  <g font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">
    <text x="114" y="315">x</text>
    <text x="52" y="258">z</text>
    <text x="98" y="284">y</text>
    <text x="274" y="262">ℓ</text>
    <text x="26" y="196">d</text>
    <text x="526" y="222">w</text>
    <text x="350" y="172" fill="#1f5fbf">B</text>
    <text x="104" y="182" fill="#c0392b">u</text>
    <text x="150" y="216">ρ</text>
  </g>
  <g font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">
    <text x="300" y="98">P</text>
    <text x="246" y="226">Q</text>
    <text x="545" y="30">P</text>
    <text x="545" y="324">Q</text>
    <text x="70" y="138" font-size="13">上流（圧力が Δ<tspan font-family="Times New Roman, serif" font-style="italic">p</tspan> 高い）</text>
    <text x="380" y="270" font-size="13">下流</text>
    <text x="440" y="175" font-size="12">（側面は絶縁体）</text>
  </g>
</svg>
