<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="q-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="q-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
  </defs>
  <!-- field strip -->
  <line x1="260" y1="40" x2="260" y2="350" stroke="#888" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="330" y1="40" x2="330" y2="350" stroke="#888" stroke-width="1" stroke-dasharray="5,4"/>
  
  <text x="338" y="58" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">磁束密度 <tspan font-family="Times New Roman, serif" font-style="italic">B</tspan>（⊙）</text>
  <rect x="260" y="40" width="70" height="310" fill="#888" fill-opacity="0.15" stroke="none"/>
  <circle cx="278" cy="52" r="6" fill="none" stroke="#222" stroke-width="1.1"/><circle cx="278" cy="52" r="1.8" fill="#222"/><circle cx="312" cy="52" r="6" fill="none" stroke="#222" stroke-width="1.1"/><circle cx="312" cy="52" r="1.8" fill="#222"/><circle cx="278" cy="342" r="6" fill="none" stroke="#222" stroke-width="1.1"/><circle cx="278" cy="342" r="1.8" fill="#222"/><circle cx="312" cy="342" r="6" fill="none" stroke="#222" stroke-width="1.1"/><circle cx="312" cy="342" r="1.8" fill="#222"/>
