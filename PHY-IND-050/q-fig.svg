  <text x="244" y="34" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">y</text>
  <line x1="260" y1="360" x2="260" y2="25" stroke="#222" stroke-width="1" marker-end="url(#q-ar)"/>
  <text x="244" y="194" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">O</text>
  <!-- coil -->
  <polygon points="410,200 290,80 170,200 290,320" fill="none" stroke="#222" stroke-width="1.6"/>
  <text x="416" y="194" font-family="Times New Roman, serif" font-size="16" fill="#222">P</text>
  <text x="272" y="78" font-family="Times New Roman, serif" font-size="16" fill="#222">Q</text>
  <text x="152" y="194" font-family="Times New Roman, serif" font-size="16" fill="#222">R</text>
  <text x="268" y="336" font-family="Times New Roman, serif" font-size="16" fill="#222">S</text>
  <!-- chords -->
  <line x1="260" y1="110.0" x2="260" y2="290.0" stroke="#c0392b" stroke-width="2.4"/>
  <line x1="330" y1="120.0" x2="330" y2="280.0" stroke="#c0392b" stroke-width="2.4"/>
  <text x="236" y="282.0" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#c0392b">l<tspan baseline-shift="sub" font-size="10" font-style="normal">0</tspan></text>
  <text x="335" y="272.0" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#c0392b">l<tspan baseline-shift="sub" font-size="10">w</tspan></text>
  <!-- a dimension along PR above -->
  <line x1="290" y1="214" x2="410" y2="214" stroke="#222" stroke-width="1" marker-start="url(#q-ar)" marker-end="url(#q-ar)"/>
  <text x="346.0" y="232" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">a</text>
  <line x1="170" y1="214" x2="290" y2="214" stroke="#222" stroke-width="1" marker-start="url(#q-ar)" marker-end="url(#q-ar)"/>
  <text x="226.0" y="232" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">a</text>
  <!-- w dimension -->
  <line x1="260" y1="372" x2="330" y2="372" stroke="#222" stroke-width="1" marker-start="url(#q-ar)" marker-end="url(#q-ar)"/>
  <text x="290.0" y="392" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">w</text>
