<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440">
  <defs>
    <marker id="q-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="q-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
    <marker id="q-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker>
  </defs>
  <!-- floor -->
  <line x1="60" y1="400" x2="460" y2="400" stroke="#222" stroke-width="1.6"/>
  <g stroke="#222" stroke-width="1">
    <line x1="70" y1="400" x2="60" y2="412"/><line x1="90" y1="400" x2="80" y2="412"/><line x1="110" y1="400" x2="100" y2="412"/><line x1="130" y1="400" x2="120" y2="412"/><line x1="150" y1="400" x2="140" y2="412"/><line x1="170" y1="400" x2="160" y2="412"/><line x1="190" y1="400" x2="180" y2="412"/><line x1="210" y1="400" x2="200" y2="412"/><line x1="230" y1="400" x2="220" y2="412"/><line x1="250" y1="400" x2="240" y2="412"/><line x1="270" y1="400" x2="260" y2="412"/><line x1="290" y1="400" x2="280" y2="412"/><line x1="310" y1="400" x2="300" y2="412"/><line x1="330" y1="400" x2="320" y2="412"/><line x1="350" y1="400" x2="340" y2="412"/><line x1="370" y1="400" x2="360" y2="412"/><line x1="390" y1="400" x2="380" y2="412"/><line x1="410" y1="400" x2="400" y2="412"/><line x1="430" y1="400" x2="420" y2="412"/><line x1="450" y1="400" x2="440" y2="412"/>
  </g>
  <text x="400" y="430" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">床</text>
  <!-- vertical axis line -->
  <line x1="250" y1="20" x2="250" y2="400" stroke="#888" stroke-width="1" stroke-dasharray="5,4"/>
  <!-- magnet -->
  <rect x="241" y="20" width="18" height="120" fill="none" stroke="#222" stroke-width="1.6"/>
  <text x="266" y="40" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">棒磁石（質量 <tspan font-family="Times New Roman, serif" font-style="italic">M</tspan>）</text>
  <text x="266" y="138" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">N</text>
  <!-- radial field lines from pole -->
  <g stroke="#888" stroke-width="1" fill="none">
    <line x1="250" y1="140" x2="190" y2="200" marker-end="url(#q-ag)"/>
    <line x1="250" y1="140" x2="310" y2="200" marker-end="url(#q-ag)"/>
    <line x1="250" y1="140" x2="250" y2="210" marker-end="url(#q-ag)"/>
    <line x1="250" y1="140" x2="175" y2="160" marker-end="url(#q-ag)"/>
    <line x1="250" y1="140" x2="325" y2="160" marker-end="url(#q-ag)"/>
  </g>
  <!-- coil (ellipse) -->
  <ellipse cx="250" cy="260" rx="32" ry="9" fill="none" stroke="#222" stroke-width="1.6"/>
  <line x1="282" y1="260" x2="330" y2="250" stroke="#222" stroke-width="1.2"/>
  <line x1="279" y1="264" x2="330" y2="266" stroke="#222" stroke-width="1.2"/>
  <circle cx="334" cy="250" r="3" fill="none" stroke="#222" stroke-width="1.2"/>
  <circle cx="334" cy="266" r="3" fill="none" stroke="#222" stroke-width="1.2"/>
  <text x="342" y="263" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">端子</text>
  <text x="170" y="245" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">コイル</text>
  <!-- radius r -->
  <line x1="250" y1="260" x2="282" y2="260" stroke="#222" stroke-width="1"/>
  <text x="262" y="282" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">r</text>
  <!-- s dimension -->
  <line x1="150" y1="140" x2="240" y2="140" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="150" y1="260" x2="216" y2="260" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="160" y1="143" x2="160" y2="257" stroke="#222" stroke-width="1" marker-start="url(#q-ar)" marker-end="url(#q-ar)"/>
  <text x="140" y="205" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">s</text>
  <!-- h and l dimensions -->
  <line x1="60" y1="70" x2="200" y2="70" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="60" y="62" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">放したときのN極の高さ</text>
  <line x1="100" y1="73" x2="100" y2="397" stroke="#222" stroke-width="1" marker-start="url(#q-ar)" marker-end="url(#q-ar)"/>
  <text x="80" y="240" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">h</text>
  <line x1="120" y1="263" x2="120" y2="397" stroke="#222" stroke-width="1" marker-start="url(#q-ar)" marker-end="url(#q-ar)"/>
  <line x1="115" y1="260" x2="150" y2="260" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="126" y="335" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">ℓ</text>
  <!-- velocity -->
  <line x1="225" y1="60" x2="225" y2="110" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#q-ab)"/>
  <text x="208" y="92" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#1f5fbf">u</text>
</svg>
