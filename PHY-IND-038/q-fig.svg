<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330">
  <defs>
    <marker id="q-ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1f5fbf"/></marker>
    <marker id="q-ak" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker>
    <marker id="q-ak2" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 z" fill="#222"/></marker>
  </defs>
  <!-- コイルA: 円（コンデンサー左, 電池右の部分を切る） -->
  <path d="M 50 158 A 120 120 0 0 1 290 158" fill="none" stroke="#222" stroke-width="1.6"/>
  <path d="M 50 178 A 120 120 0 0 0 290 178" fill="none" stroke="#222" stroke-width="1.6"/>
  <!-- コンデンサー（左） -->
  <line x1="50" y1="158" x2="50" y2="164" stroke="#222" stroke-width="1.6"/>
  <line x1="38" y1="164" x2="62" y2="164" stroke="#222" stroke-width="2.2"/>
  <line x1="38" y1="172" x2="62" y2="172" stroke="#222" stroke-width="2.2"/>
  <line x1="50" y1="172" x2="50" y2="178" stroke="#222" stroke-width="1.6"/>
  <!-- 電池（右）：長い方が上(正極) -->
  <line x1="290" y1="158" x2="290" y2="164" stroke="#222" stroke-width="1.6"/>
  <line x1="276" y1="164" x2="304" y2="164" stroke="#222" stroke-width="1.6"/>
  <line x1="283" y1="172" x2="297" y2="172" stroke="#222" stroke-width="3"/>
  <line x1="290" y1="172" x2="290" y2="178" stroke="#222" stroke-width="1.6"/>
  <text x="310" y="174" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">V</text>
  <text x="66" y="150" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">極板P</text>
  <text x="66" y="192" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">極板Q</text>
  <!-- コイルB -->
  <path d="M 189.9 158.7 A 22 22 0 1 0 189.9 177.3" fill="none" stroke="#222" stroke-width="1.6"/>
  <rect x="185.9" y="158.7" width="8" height="18.6" fill="none" stroke="#222" stroke-width="1.6"/>
  <text x="199" y="174" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">r</text>
  <text x="150" y="215" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">コイルB</text>
  <line x1="170" y1="168" x2="154" y2="152" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="140" y="146" font-family="Times New Roman, serif" font-style="italic" font-size="14" fill="#222">R<tspan baseline-shift="sub" font-size="10" font-style="normal">B</tspan></text>
  <line x1="170" y1="168" x2="255" y2="253" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="222" y="228" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">R<tspan baseline-shift="sub" font-size="10" font-style="normal">A</tspan></text>
  <text x="140" y="308" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">コイルA</text>
  <!-- 正の向き（反時計回り） -->
  <path d="M 225 66 A 120 120 0 0 0 115 66" fill="none" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#q-ar)" transform="translate(0,-14)"/>
  <text x="120" y="34" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#1f5fbf">正の向き（反時計回り）</text>
  <!-- 右側: 極板の側面図 -->
  <text x="400" y="40" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">コンデンサーの側面図</text>
  <line x1="390" y1="90" x2="560" y2="90" stroke="#222" stroke-width="3"/>
  <line x1="390" y1="150" x2="560" y2="150" stroke="#222" stroke-width="3"/>
  <text x="566" y="95" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">P</text>
  <text x="566" y="155" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">Q</text>
  <!-- 誘電体 -->
  <rect x="340" y="92" width="110" height="56" fill="none" stroke="#c0392b" stroke-width="1.6"/>
  <text x="352" y="126" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#c0392b">ε<tspan baseline-shift="sub" font-size="10" font-style="normal">r</tspan></text>
  <line x1="450" y1="120" x2="490" y2="120" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#q-ar)"/>
  <!-- s -->
  <line x1="390" y1="168" x2="390" y2="182" stroke="#888" stroke-width="1"/>
  <line x1="450" y1="160" x2="450" y2="182" stroke="#888" stroke-width="1"/>
  <line x1="392" y1="176" x2="448" y2="176" stroke="#222" stroke-width="1" marker-end="url(#q-ak)" marker-start="url(#q-ak2)"/>
  <text x="414" y="196" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">s</text>
  <!-- a -->
  <line x1="390" y1="62" x2="390" y2="84" stroke="#888" stroke-width="1"/>
  <line x1="560" y1="62" x2="560" y2="84" stroke="#888" stroke-width="1"/>
  <line x1="392" y1="70" x2="558" y2="70" stroke="#222" stroke-width="1" marker-end="url(#q-ak)" marker-start="url(#q-ak2)"/>
  <text x="470" y="64" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">a</text>
  <!-- gap -->
  <line x1="590" y1="92" x2="590" y2="148" stroke="#222" stroke-width="1" marker-end="url(#q-ak)" marker-start="url(#q-ak2)"/>
  <text x="596" y="126" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">d</text>
  <text x="380" y="232" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">極板は横 <tspan font-family="Times New Roman, serif" font-style="italic">a</tspan>，奥行き <tspan font-family="Times New Roman, serif" font-style="italic">b</tspan> の長方形</text>
  <text x="380" y="254" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">（(3)(4)では誘電体を除き，</text>
  <text x="380" y="274" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">　極板Pを平行に遠ざける）</text>
</svg>
