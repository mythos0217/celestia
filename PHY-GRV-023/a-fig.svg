<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300">
<defs><marker id="a-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
<marker id="a-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs>
<!-- M=3m: L=90px, Lmax=150px, a=120, c=30, b=sqrt(120^2-30^2)=116.2 ; focus at (330,150), center (300,150) -->
<ellipse cx="300" cy="150" rx="120" ry="116.2" fill="none" stroke="#222" stroke-width="1.6"/>
<circle cx="330" cy="150" r="9" fill="#222"/>
<text x="312" y="128" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">天体1</text>
<circle cx="420" cy="150" r="6" fill="#222"/>
<text x="430" y="172" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">天体2</text><text x="430" y="192" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">（消滅の瞬間＝近点）</text>
<line x1="420" y1="150" x2="420" y2="70" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#a-ah)"/>
<text x="428" y="84" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#1f5fbf">ωL</text>
<line x1="330" y1="150" x2="420" y2="150" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
<text x="368" y="160" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">L</text>
<circle cx="180" cy="150" r="4" fill="#c0392b"/>
<line x1="180" y1="150" x2="330" y2="150" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,3"/>
<text x="190" y="200" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#c0392b">遠点：<tspan font-family="Times New Roman, serif" font-style="italic">L</tspan>(<tspan font-family="Times New Roman, serif" font-style="italic">M</tspan>+2<tspan font-family="Times New Roman, serif" font-style="italic">m</tspan>)/<tspan font-family="Times New Roman, serif" font-style="italic">M</tspan></text>
<text x="20" y="30" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">天体1から見た天体2の相対運動（図は <tspan font-family="Times New Roman, serif" font-style="italic">M</tspan>=3<tspan font-family="Times New Roman, serif" font-style="italic">m</tspan>）</text>
</svg>
