<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300">
<defs><marker id="q-ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f5fbf"/></marker></defs>
<!-- battery at x=60, long plate (positive) on top -->
<line x1="60" y1="60" x2="60" y2="150" stroke="#222" stroke-width="1.6" fill="none"/>
<line x1="44" y1="150" x2="76" y2="150" stroke="#222" stroke-width="1.6"/>
<line x1="52" y1="160" x2="68" y2="160" stroke="#222" stroke-width="3"/>
<line x1="60" y1="160" x2="60" y2="260" stroke="#222" stroke-width="1.6" fill="none"/>
<text x="26" y="162" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">E</text>
<!-- top wire to coil -->
<line x1="60" y1="60" x2="110" y2="60" stroke="#222" stroke-width="1.6" fill="none"/>
<path d="M110,60 a10,10 0 0 1 20,0 a10,10 0 0 1 20,0 a10,10 0 0 1 20,0 a10,10 0 0 1 20,0" stroke="#222" stroke-width="1.6" fill="none"/>
<text x="140" y="38" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">L</text>
<line x1="190" y1="60" x2="250" y2="60" stroke="#222" stroke-width="1.6" fill="none"/>
<line x1="95" y1="78" x2="125" y2="78" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#q-ar)"/>
<text x="102" y="98" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">I</text>
<circle cx="250" cy="60" r="3" fill="#222"/>
<!-- switch from P down -->
<line x1="250" y1="60" x2="250" y2="140" stroke="#222" stroke-width="1.6" fill="none"/>
<circle cx="250" cy="140" r="3" fill="#fff" stroke="#222" stroke-width="1.4"/>
<line x1="250" y1="180" x2="232" y2="146" stroke="#222" stroke-width="1.6"/>
<circle cx="250" cy="180" r="3" fill="#fff" stroke="#222" stroke-width="1.4"/>
<line x1="250" y1="183" x2="250" y2="260" stroke="#222" stroke-width="1.6" fill="none"/>
<text x="262" y="166" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">S</text>
<!-- diode P -> Q, triangle pointing right -->
<line x1="250" y1="60" x2="300" y2="60" stroke="#222" stroke-width="1.6" fill="none"/>
<path d="M300,48 L300,72 L322,60 Z" fill="#fff" stroke="#222" stroke-width="1.6"/>
<line x1="322" y1="46" x2="322" y2="74" stroke="#222" stroke-width="1.6"/>
<line x1="322" y1="60" x2="460" y2="60" stroke="#222" stroke-width="1.6" fill="none"/>
<text x="292" y="36" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">ダイオード</text>
<circle cx="370" cy="60" r="3" fill="#222"/>
<!-- capacitor -->
<line x1="370" y1="60" x2="370" y2="150" stroke="#222" stroke-width="1.6" fill="none"/>
<line x1="350" y1="150" x2="390" y2="150" stroke="#222" stroke-width="2"/>
<line x1="350" y1="162" x2="390" y2="162" stroke="#222" stroke-width="2"/>
<line x1="370" y1="162" x2="370" y2="260" stroke="#222" stroke-width="1.6" fill="none"/>
<text x="396" y="162" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">C</text>
<!-- resistor -->
<line x1="460" y1="60" x2="460" y2="125" stroke="#222" stroke-width="1.6" fill="none"/>
<rect x="450" y="125" width="20" height="60" fill="#fff" stroke="#222" stroke-width="1.6"/>
<line x1="460" y1="185" x2="460" y2="260" stroke="#222" stroke-width="1.6" fill="none"/>
<text x="478" y="162" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">R</text>
<circle cx="370" cy="260" r="3" fill="#222"/><circle cx="250" cy="260" r="3" fill="#222"/>
<line x1="60" y1="260" x2="460" y2="260" stroke="#222" stroke-width="1.6" fill="none"/>
<text x="300" y="290" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">負荷側の電圧 <tspan font-family="Times New Roman, serif" font-style="italic">V</tspan><tspan baseline-shift="sub" font-size="10">0</tspan>（上側が高電位）</text>
</svg>