    <circle cx="50" cy="180" r="4"/>
    <line x1="54" y1="180" x2="110" y2="180"/>
    <rect x="110" y="170" width="70" height="20"/>
    <line x1="180" y1="180" x2="250" y2="180"/>
    <!-- element T -->
    <line x1="250" y1="148" x2="250" y2="212" stroke-width="3.2"/>
    <line x1="250" y1="166" x2="290" y2="136"/>
    <line x1="290" y1="136" x2="290" y2="60"/>
    <line x1="250" y1="194" x2="290" y2="224" marker-end="url(#q-ah)"/>
    <line x1="290" y1="224" x2="290" y2="290"/>
    <!-- top wire, R_C -->
    <line x1="290" y1="60" x2="350" y2="60"/>
    <rect x="350" y="50" width="70" height="20"/>
    <line x1="420" y1="60" x2="480" y2="60"/>
    <!-- battery -->
    <line x1="480" y1="60" x2="480" y2="160"/>
    <line x1="462" y1="160" x2="498" y2="160"/>
    <line x1="471" y1="171" x2="489" y2="171" stroke-width="3"/>
    <line x1="480" y1="171" x2="480" y2="290"/>
    <!-- ground line -->
    <line x1="54" y1="290" x2="480" y2="290"/>
    <circle cx="50" cy="290" r="4"/>
    <line x1="290" y1="290" x2="290" y2="305"/>
    <line x1="276" y1="305" x2="304" y2="305"/>
    <line x1="281" y1="311" x2="299" y2="311"/>
    <line x1="286" y1="317" x2="294" y2="317"/>
    <!-- output -->
    <line x1="290" y1="95" x2="200" y2="95"/>
    <circle cx="196" cy="95" r="4"/>
  </g>
  <circle cx="290" cy="95" r="3.2" fill="#222"/>
  <g font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">
    <text x="42" y="166">P</text>
    <text x="232" y="172">B</text>
    <text x="298" y="130">C</text>
    <text x="298" y="250">E</text>
    <text x="320" y="330" font-size="14">接地</text>
    <text x="100" y="100" font-size="14">出力</text>
    <text x="16" y="240" font-size="14">入力</text>
    <text x="214" y="232">T</text>
  </g>
  <g font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">
    <text x="128" y="160">R<tspan baseline-shift="sub" font-size="10" font-style="normal">A</tspan></text>
    <text x="370" y="40">R<tspan baseline-shift="sub" font-size="10" font-style="normal">C</tspan></text>
    <text x="504" y="172">V<tspan baseline-shift="sub" font-size="10" font-style="normal">S</tspan></text>
    <text x="134" y="100">V<tspan baseline-shift="sub" font-size="10" font-style="normal">out</tspan></text>
    <text x="16" y="262">V<tspan baseline-shift="sub" font-size="10" font-style="normal">in</tspan></text>
