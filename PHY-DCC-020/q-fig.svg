<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340">
  <defs>
    <marker id="q-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
  </defs>
  <g stroke="#222" stroke-width="1.6" fill="none">
