<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300">
<defs><marker id="q-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<g font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">
<!-- incident from lower-left at 60deg -->
<line x1="40" y1="290" x2="113" y2="214" stroke="#222" stroke-width="1.6" marker-end="url(#q-ah)"/>
<text x="66" y="286">単色X線 <tspan font-family="Times New Roman, serif" font-style="italic">λ</tspan><tspan baseline-shift="sub" font-size="10">0</tspan></text>
<rect x="110" y="190" width="20" height="20" fill="#888" stroke="#222" stroke-width="1.6"/>
<text x="100" y="180">石墨</text>
<line x1="120" y1="200" x2="160" y2="158" stroke="#888" stroke-width="1" stroke-dasharray="5,4"/>
<path d="M 150 200 A 30 30 0 0 0 140 178" fill="none" stroke="#222" stroke-width="1"/>
<text x="156" y="188" font-family="Times New Roman, serif" font-style="italic" font-size="16">φ</text>
<line x1="130" y1="200" x2="420" y2="200" stroke="#222" stroke-width="1.6"/>
<line x1="250" y1="200" x2="262" y2="200" stroke="#222" stroke-width="1.6" marker-end="url(#q-ah)"/>
<line x1="300" y1="165" x2="300" y2="194" stroke="#222" stroke-width="3"/>
<line x1="300" y1="206" x2="300" y2="235" stroke="#222" stroke-width="3"/>
<text x="276" y="256">スリット</text>
<!-- crystal at (420,200) rotated -25 -->
<g transform="translate(420,200) rotate(-25)"><rect x="-40" y="0" width="80" height="14" fill="none" stroke="#222" stroke-width="1.6"/><line x1="-40" y1="4" x2="40" y2="4" stroke="#222" stroke-width="0.8"/><line x1="-40" y1="8" x2="40" y2="8" stroke="#222" stroke-width="0.8"/><line x1="-40" y1="12" x2="40" y2="12" stroke="#222" stroke-width="0.8"/></g>
<text x="400" y="250">結晶（面間隔 <tspan font-family="Times New Roman, serif" font-style="italic">d</tspan>）</text>
<line x1="420" y1="200" x2="590" y2="200" stroke="#888" stroke-width="1" stroke-dasharray="5,4"/>
<!-- theta arc between beam and crystal surface -->
<path d="M 480 200 A 60 60 0 0 0 474 175" fill="none" stroke="#222" stroke-width="1"/>
<text x="486" y="194" font-family="Times New Roman, serif" font-style="italic" font-size="16">θ</text>
<!-- reflected beam at 50deg -->
<line x1="420" y1="200" x2="530" y2="69" stroke="#222" stroke-width="1.6" marker-end="url(#q-ah)"/>
<path d="M 520 200 A 100 100 0 0 0 484 123" fill="none" stroke="#222" stroke-width="1"/>
<text x="525" y="150">2<tspan font-family="Times New Roman, serif" font-style="italic">θ</tspan></text>
<rect x="526" y="42" width="26" height="22" fill="#222" transform="rotate(-40 539 53)"/>
<text x="560" y="50">検出器</text>
</g>
</svg>
