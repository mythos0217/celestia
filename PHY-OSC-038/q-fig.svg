<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360">
<defs>
<marker id="q-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#222"/></marker>
</defs>
<!-- scale -->
<rect x="150" y="300" width="160" height="26" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="210" y="319" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">はかり</text>
<line x1="120" y1="326" x2="340" y2="326" stroke="#222" stroke-width="1.6"/>
<!-- tube walls -->
<line x1="190" y1="40" x2="190" y2="300" stroke="#222" stroke-width="1.6"/>
<line x1="270" y1="40" x2="270" y2="300" stroke="#222" stroke-width="1.6"/>
<line x1="186" y1="300" x2="274" y2="300" stroke="#222" stroke-width="3"/>
<text x="280" y="70" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">円筒（質量 <tspan font-family="Times New Roman, serif" font-style="italic">M</tspan>）</text>
<!-- spring compressed from y=300 to y=245 -->
<polyline points="230,300 230,296 212,291 248,284 212,277 248,270 212,263 248,256 230,251 230,247" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="252" y="282" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">k</text>
<!-- disk at y=243 -->
<rect x="191" y="239" width="78" height="8" fill="#888" stroke="#222" stroke-width="1.2"/>
<text x="280" y="246" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">円板（質量 <tspan font-family="Times New Roman, serif" font-style="italic">m</tspan>）</text>
<!-- x axis -->
<line x1="110" y1="300" x2="110" y2="40" stroke="#222" stroke-width="1" marker-end="url(#q-ar)"/>
<text x="96" y="44" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">x</text>
<!-- x=0 natural length at y=170 -->
<line x1="110" y1="170" x2="270" y2="170" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
<text x="88" y="175" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">0</text>
<text x="280" y="166" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">ばねの自然長の上端</text>
<line x1="110" y1="243" x2="190" y2="243" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
<text x="20" y="235" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">はなす位置</text>
<text x="10" y="255" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">−(1+√2)<tspan font-family="Times New Roman, serif" font-style="italic">g</tspan>/<tspan font-family="Times New Roman, serif" font-style="italic">ω</tspan><tspan baseline-shift="super" font-size="10">2</tspan></text>
<text x="280" y="120" font-family="Noto Sans CJK JP, sans-serif" font-size="12" fill="#222">（II では <tspan font-family="Times New Roman, serif" font-style="italic">x</tspan>&gt;0 の内壁だけが</text>
<text x="280" y="138" font-family="Noto Sans CJK JP, sans-serif" font-size="12" fill="#222">　摩擦力 <tspan font-family="Times New Roman, serif" font-style="italic">αmg</tspan> をおよぼす）</text>
</svg>
