<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420">
<defs>
<marker id="q-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
<marker id="q-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
</defs>
<!-- pipe walls -->
<rect x="150" y="60" width="12" height="320" fill="none" stroke="#222" stroke-width="1.6"/>
<rect x="228" y="60" width="12" height="320" fill="none" stroke="#222" stroke-width="1.6"/>
<g stroke="#222" stroke-width="0.8">
<line x1="150" y1="80" x2="162" y2="68"/><line x1="150" y1="110" x2="162" y2="98"/><line x1="150" y1="140" x2="162" y2="128"/><line x1="150" y1="170" x2="162" y2="158"/><line x1="150" y1="200" x2="162" y2="188"/><line x1="150" y1="230" x2="162" y2="218"/><line x1="150" y1="260" x2="162" y2="248"/><line x1="150" y1="290" x2="162" y2="278"/><line x1="150" y1="320" x2="162" y2="308"/><line x1="150" y1="350" x2="162" y2="338"/><line x1="150" y1="378" x2="162" y2="366"/>
<line x1="228" y1="80" x2="240" y2="68"/><line x1="228" y1="110" x2="240" y2="98"/><line x1="228" y1="140" x2="240" y2="128"/><line x1="228" y1="170" x2="240" y2="158"/><line x1="228" y1="200" x2="240" y2="188"/><line x1="228" y1="230" x2="240" y2="218"/><line x1="228" y1="260" x2="240" y2="248"/><line x1="228" y1="290" x2="240" y2="278"/><line x1="228" y1="320" x2="240" y2="308"/><line x1="228" y1="350" x2="240" y2="338"/><line x1="228" y1="378" x2="240" y2="366"/>
</g>
<!-- magnet -->
<rect x="172" y="180" width="46" height="22" fill="none" stroke="#222" stroke-width="1.6"/>
<rect x="172" y="202" width="46" height="22" fill="#ddd" stroke="#222" stroke-width="1.6"/>
<text x="195" y="197" font-family="Noto Sans CJK JP, sans-serif" font-size="14" text-anchor="middle" fill="#222">S</text>
<text x="195" y="219" font-family="Noto Sans CJK JP, sans-serif" font-size="14" text-anchor="middle" fill="#222">N</text>
<text x="275" y="208" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">m</text>
<line x1="270" y1="203" x2="222" y2="203" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
<!-- pipe label -->
<text x="250" y="320" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">銅のパイプ（質量 <tspan font-family="Times New Roman, serif" font-style="italic">M</tspan>）</text>
<!-- hand force -->
<line x1="195" y1="56" x2="195" y2="14" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#q-ab)"/>
<line x1="150" y1="60" x2="240" y2="60" stroke="#222" stroke-width="1.6"/>
<text x="204" y="30" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#1f5fbf">手の力 <tspan font-family="Times New Roman, serif" font-style="italic">F</tspan></text>
<!-- pipe velocity -->
<line x1="110" y1="260" x2="110" y2="190" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#q-ab)"/>
<text x="64" y="232" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#1f5fbf">速さ <tspan font-family="Times New Roman, serif" font-style="italic">u</tspan></text>
<text x="40" y="290" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">（パイプの運動）</text>
<!-- gravity -->
<line x1="40" y1="70" x2="40" y2="130" stroke="#222" stroke-width="1.6" marker-end="url(#q-ak)"/>
<text x="50" y="108" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">g</text>
<!-- axis -->
<line x1="195" y1="380" x2="195" y2="410" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
<text x="204" y="408" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">鉛直な軸</text>
</svg>
