<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 380">
  <defs>
    <marker id="q-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="q-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker>
    <marker id="q-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
  </defs>
  <!-- z axis -->
  <line x1="200" y1="360" x2="200" y2="20" stroke="#222" stroke-width="1.2" marker-end="url(#q-ak)"/>
  <text x="208" y="28" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">z</text>
  <!-- field lines converging upward (schematic) -->
  <g fill="none" stroke="#888" stroke-width="1">
    <path d="M 80 350 C 120 250, 160 150, 170 40" marker-end="url(#q-ag)"/>
    <path d="M 130 350 C 155 250, 180 150, 185 40" marker-end="url(#q-ag)"/>
    <path d="M 320 350 C 280 250, 240 150, 230 40" marker-end="url(#q-ag)"/>
    <path d="M 270 350 C 245 250, 220 150, 215 40" marker-end="url(#q-ag)"/>
  </g>
  <text x="300" y="300" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#888">磁力線（模式図）</text>
  <!-- ring -->
  <ellipse cx="200" cy="170" rx="70" ry="16" fill="none" stroke="#222" stroke-width="1.8"/>
  <line x1="200" y1="170" x2="270" y2="170" stroke="#222" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="228" y="160" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">a</text>
  <text x="280" y="160" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">輪（質量 <tspan font-family="Times New Roman, serif" font-style="italic">m</tspan>，抵抗 <tspan font-family="Times New Roman, serif" font-style="italic">R</tspan>）</text>
  <!-- velocity -->
  <line x1="120" y1="150" x2="120" y2="205" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#q-ab)"/>
  <text x="102" y="186" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#1f5fbf">v</text>
  <!-- height z mark -->
  <line x1="196" y1="270" x2="204" y2="270" stroke="#222" stroke-width="1.2"/>
  <text x="208" y="275" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">0</text>
  <line x1="40" y1="170" x2="40" y2="270" stroke="#888" stroke-width="1" marker-start="url(#q-ag)" marker-end="url(#q-ag)"/>
  <line x1="36" y1="270" x2="196" y2="270" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="36" y1="170" x2="130" y2="170" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="22" y="225" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">z</text>
  <text x="30" y="372" font-family="Times New Roman, serif" font-style="italic" font-size="14" fill="#222">B<tspan baseline-shift="sub" font-size="10">z</tspan><tspan font-style="normal"> = </tspan>B<tspan baseline-shift="sub" font-size="10" font-style="normal">0</tspan><tspan font-style="normal"> + </tspan>Cz</text>
</svg>
