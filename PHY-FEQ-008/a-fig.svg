<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300">
  <defs>
    <marker id="a-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
    <marker id="a-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <text x="20" y="24" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">(a) 遠方の液面より上の液体（水，θ＝0）</text>
  <rect x="40" y="50" width="10" height="120" fill="none" stroke="#222" stroke-width="1.6"/>
  <path d="M50,60 C52,100 80,126 160,130 L260,130 L260,130 L50,130 Z" fill="#888" fill-opacity="0.15" stroke="#222" stroke-width="1.6"/>
  <line x1="260" y1="122" x2="260" y2="138" stroke="#888" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="260" y1="130" x2="310" y2="130" stroke="#c0392b" stroke-width="1.8" marker-end="url(#a-ar)"/>
  <text x="300" y="120" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#c0392b">γ</text>
  <text x="222" y="156" font-family="Noto Sans CJK JP, sans-serif" font-size="12" fill="#222">切り口の表面張力</text>
  <line x1="110" y1="95" x2="62" y2="95" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#a-ab)"/>
  <text x="100" y="80" font-family="Noto Sans CJK JP, sans-serif" font-size="12" fill="#1f5fbf">圧力の不足分で壁へ</text>
  <text x="118" y="100" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#1f5fbf">ρgh<tspan baseline-shift="super" font-size="10" font-style="normal">2</tspan><tspan font-style="normal">/2</tspan></text>
  <text x="30" y="215" font-family="Noto Sans CJK JP, sans-serif" font-size="12" fill="#222">壁と大気から受ける水平力の合計は</text><text x="30" y="233" font-family="Noto Sans CJK JP, sans-serif" font-size="12" fill="#222">壁の向きに ρgh²/2（大気圧 <tspan font-family="Times New Roman, serif" font-style="italic">p</tspan>₀ の分は打ち消す）</text><text x="30" y="251" font-family="Noto Sans CJK JP, sans-serif" font-size="12" fill="#222">つり合い：ρgh²/2 ＝ γ</text>

  <text x="340" y="24" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">(b) 液体全体（任意の θ）</text>
  <rect x="350" y="50" width="10" height="210" fill="none" stroke="#222" stroke-width="1.6"/>
  <path d="M360,70 C362,105 390,126 470,130 L570,130 L570,260 L360,260 Z" fill="#888" fill-opacity="0.15" stroke="#222" stroke-width="1.6"/>
  <line x1="570" y1="130" x2="610" y2="130" stroke="#c0392b" stroke-width="1.8" marker-end="url(#a-ar)"/>
  <text x="598" y="120" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#c0392b">γ</text>
  <line x1="625" y1="215" x2="575" y2="215" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#a-ab)"/>
  <text x="520" y="245" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#1f5fbf">ρgD<tspan baseline-shift="super" font-size="10" font-style="normal">2</tspan><tspan font-style="normal">/2</tspan></text>
  <line x1="365" y1="200" x2="420" y2="200" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#a-ab)"/>
  <text x="372" y="190" font-family="Noto Sans CJK JP, sans-serif" font-size="12" fill="#1f5fbf">壁から <tspan font-family="Times New Roman, serif" font-style="italic" font-size="15">F</tspan></text>
  <text x="340" y="285" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">F <tspan font-style="normal" font-family="Noto Sans CJK JP, sans-serif" font-size="13">＝</tspan> ρgD<tspan baseline-shift="super" font-size="10" font-style="normal">2</tspan><tspan font-style="normal">/2 − </tspan>γ</text>
</svg>
