<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400">
  <defs>
    <marker id="q-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
    <marker id="q-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="q-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="q-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker>
  </defs>
  <!-- vertical guide line -->
  <line x1="200" y1="40" x2="200" y2="360" stroke="#888" stroke-width="1" stroke-dasharray="5,4"/>
  <!-- initial position of A -->
  <circle cx="200" cy="70" r="9" fill="none" stroke="#222" stroke-width="1.6"/>
  <text x="216" y="66" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">はじめの位置（静かに放す）</text>
  <!-- height H0 dimension -->
  <line x1="130" y1="70" x2="190" y2="70" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="130" y1="250" x2="190" y2="250" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="140" y1="72" x2="140" y2="248" stroke="#222" stroke-width="1" marker-start="url(#q-ak)" marker-end="url(#q-ak)"/>
  <text x="108" y="166" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">H<tspan baseline-shift="sub" font-size="10" font-style="normal">0</tspan></text>
  <!-- point O -->
  <line x1="185" y1="250" x2="215" y2="250" stroke="#222" stroke-width="1.6"/>
  <text x="222" y="262" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">O</text>
  <!-- ball A just above O, moving down -->
  <circle cx="200" cy="238" r="9" fill="#fff" fill-opacity="0" stroke="#222" stroke-width="1.6"/>
  <text x="170" y="232" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">A</text>
  <text x="160" y="218" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">m</text>
  <line x1="235" y1="200" x2="235" y2="236" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#q-ab)"/>
  <text x="243" y="222" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#1f5fbf">落下してくる</text>
  <!-- hitter below, moving up -->
  <circle cx="200" cy="275" r="15" fill="#222" fill-opacity="0.15" stroke="#222" stroke-width="1.6"/>
  <text x="140" y="300" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">打球</text>
  <text x="140" y="320" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">M<tspan baseline-shift="sub" font-size="10">n</tspan></text>
  <line x1="235" y1="318" x2="235" y2="280" stroke="#c0392b" stroke-width="1.8" marker-end="url(#q-ar)"/>
  <text x="243" y="304" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#c0392b">V<tspan baseline-shift="sub" font-size="10" font-style="normal">0</tspan></text>
  <text x="270" y="304" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">（衝突直前，上向き）</text>
  <!-- launcher -->
  <rect x="180" y="330" width="40" height="22" fill="none" stroke="#222" stroke-width="1.6"/>
  <text x="228" y="347" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">発射装置（1回ごとに新しい打球）</text>
  <g stroke="#222" stroke-width="1"><line x1="160" y1="352" x2="260" y2="352"/>
  <line x1="165" y1="352" x2="157" y2="362"/><line x1="180" y1="352" x2="172" y2="362"/><line x1="195" y1="352" x2="187" y2="362"/><line x1="210" y1="352" x2="202" y2="362"/><line x1="225" y1="352" x2="217" y2="362"/><line x1="240" y1="352" x2="232" y2="362"/><line x1="255" y1="352" x2="247" y2="362"/></g>
</svg>
