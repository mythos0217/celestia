<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400">
  <defs><marker id="a-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
  <!-- axes: x: n 0..8 -> 70..470 (50/step); y: H/H0 0..90 -> 340..40 (300/90) -->
  <line x1="70" y1="340" x2="500" y2="340" stroke="#222" stroke-width="1.2" marker-end="url(#a-ak)"/>
  <line x1="70" y1="340" x2="70" y2="25" stroke="#222" stroke-width="1.2" marker-end="url(#a-ak)"/>
  <text x="506" y="345" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">n</text>
  <text x="40" y="22" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">最高点の高さ / <tspan font-family="Times New Roman, serif" font-style="italic">H</tspan><tspan baseline-shift="sub" font-size="10">0</tspan></text>
  <g font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">
    <text x="66" y="358">0</text><text x="116" y="358">1</text><text x="166" y="358">2</text><text x="216" y="358">3</text><text x="266" y="358">4</text><text x="316" y="358">5</text><text x="366" y="358">6</text><text x="416" y="358">7</text><text x="466" y="358">8</text>
    <text x="50" y="344">0</text><text x="42" y="277">20</text><text x="42" y="210">40</text><text x="42" y="144">60</text><text x="42" y="77">80</text>
  </g>
  <g stroke="#888" stroke-width="0.6" stroke-dasharray="2,4"><line x1="70" y1="273.3" x2="490" y2="273.3"/><line x1="70" y1="206.7" x2="490" y2="206.7"/><line x1="70" y1="140" x2="490" y2="140"/><line x1="70" y1="73.3" x2="490" y2="73.3"/></g>
  <!-- asymptote 81 -->
  <line x1="70" y1="70" x2="490" y2="70" stroke="#888" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="330" y="62" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">上限 <tspan font-family="Times New Roman, serif" font-style="italic">K</tspan><tspan baseline-shift="super" font-size="10">2</tspan><tspan font-family="Times New Roman, serif" font-style="italic">H</tspan><tspan baseline-shift="sub" font-size="10">0</tspan> = 81<tspan font-family="Times New Roman, serif" font-style="italic">H</tspan><tspan baseline-shift="sub" font-size="10">0</tspan></text>
  <!-- 49 line -->
  <line x1="70" y1="176.7" x2="490" y2="176.7" stroke="#888" stroke-width="1" stroke-dasharray="2,3"/>
  <text x="76" y="171" font-family="Noto Sans CJK JP, sans-serif" font-size="12" fill="#222">49</text>
  <!-- stop scheme (red): n=0..4 -> 1,4,9,16,25 -->
  <polyline points="70,336.7 120,326.7 170,310 220,286.7 270,256.7" fill="none" stroke="#c0392b" stroke-width="1.6"/>
  <g fill="#c0392b"><circle cx="70" cy="336.7" r="4"/><circle cx="120" cy="326.7" r="4"/><circle cx="170" cy="310" r="4"/><circle cx="220" cy="286.7" r="4"/><circle cx="270" cy="256.7" r="4"/></g>
  <text x="250" y="300" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#c0392b">打球を止める方式（4回で終了）</text>
  <!-- greedy (blue): 1,6.76,15.05,24.05,32.76,40.69,47.65,53.62,58.64 -->
  <polyline points="70,336.7 120,317.5 170,289.8 220,259.8 270,230.8 320,204.4 370,181.2 420,161.3 470,144.5" fill="none" stroke="#1f5fbf" stroke-width="1.6"/>
  <g fill="#1f5fbf"><circle cx="70" cy="336.7" r="4"/><circle cx="120" cy="317.5" r="4"/><circle cx="170" cy="289.8" r="4"/><circle cx="220" cy="259.8" r="4"/><circle cx="270" cy="230.8" r="4"/><circle cx="320" cy="204.4" r="4"/><circle cx="370" cy="181.2" r="4"/><circle cx="420" cy="161.3" r="4"/><circle cx="470" cy="144.5" r="4"/></g>
  <text x="300" y="130" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#1f5fbf">常に質量 9<tspan font-family="Times New Roman, serif" font-style="italic">m</tspan> の打球</text>
