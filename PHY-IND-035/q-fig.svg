<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360">
<defs>
<marker id="q-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#222"/></marker>
<marker id="q-ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#222"/></marker>
<pattern id="q-hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#888" stroke-width="1"/></pattern>
</defs>
<!-- axes -->
<line x1="40" y1="200" x2="490" y2="200" stroke="#222" stroke-width="1" marker-end="url(#q-ar)"/>
<text x="492" y="218" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">x</text>
<line x1="170" y1="345" x2="170" y2="30" stroke="#222" stroke-width="1" marker-end="url(#q-ar)"/>
<text x="178" y="36" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">y</text>
<!-- solenoid -->
<circle cx="170" cy="200" r="45" fill="url(#q-hat)" stroke="#222" stroke-width="1.6"/>
<text x="148" y="232" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">O</text>
<line x1="170" y1="200" x2="202" y2="232" stroke="#222" stroke-width="1" marker-end="url(#q-ar)"/>
<text x="190" y="212" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">b</text>
<text x="60" y="120" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">ソレノイド</text>
<line x1="100" y1="126" x2="140" y2="166" stroke="#888" stroke-width="1"/>
<text x="62" y="140" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">（内部の磁場 <tspan font-family="Times New Roman, serif" font-style="italic">B</tspan><tspan baseline-shift="sub" font-size="10">0</tspan>＋<tspan font-family="Times New Roman, serif" font-style="italic">B</tspan><tspan baseline-shift="sub" font-size="10">1</tspan>）</text>
<!-- ball P -->
<circle cx="330" cy="200" r="6" fill="#222"/>
<text x="336" y="190" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">P</text>
<text x="345" y="226" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">m, q</text>
<!-- r0 dimension -->
<line x1="170" y1="290" x2="330" y2="290" stroke="#222" stroke-width="1" marker-start="url(#q-ab)" marker-end="url(#q-ab)"/>
<line x1="330" y1="206" x2="330" y2="298" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
<text x="240" y="310" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">r<tspan baseline-shift="sub" font-size="10">0</tspan></text>
<!-- B0 symbols -->
<g fill="none" stroke="#222" stroke-width="1.2">
<circle cx="420" cy="80" r="8"/><circle cx="420" cy="80" r="2" fill="#222"/>
<circle cx="90" cy="300" r="8"/><circle cx="90" cy="300" r="2" fill="#222"/>
<circle cx="440" cy="300" r="8"/><circle cx="440" cy="300" r="2" fill="#222"/>
<circle cx="300" cy="70" r="8"/><circle cx="300" cy="70" r="2" fill="#222"/>
</g>
<text x="434" y="86" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">B<tspan baseline-shift="sub" font-size="10">0</tspan></text>
<text x="314" y="76" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">B<tspan baseline-shift="sub" font-size="10">0</tspan></text>
<text x="300" y="350" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">（<tspan font-family="Times New Roman, serif" font-style="italic">z</tspan> 軸は O を通り紙面の裏から表へ）</text>
</svg>
