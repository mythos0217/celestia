<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240">
  <defs><marker id="q-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
  <!-- cylinder walls -->
  <path d="M 70 50 L 520 50 L 520 170 L 70 170" fill="none" stroke="#222" stroke-width="3"/>
  <!-- piston W -->
  <rect x="110" y="52" width="10" height="116" fill="none" stroke="#222" stroke-width="1.6"/>
  <line x1="40" y1="110" x2="110" y2="110" stroke="#222" stroke-width="4"/>
  <text x="108" y="40" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">W</text>
  <text x="40" y="98" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">外力</text>
  <text x="10" y="200" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">（W の左側は真空）</text>
  <!-- partition D -->
  <rect x="345" y="52" width="8" height="116" fill="none" stroke="#222" stroke-width="1.6"/>
  <text x="342" y="40" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">D</text>
  <!-- stoppers S at left of D, at position x=270 -->
  <path d="M 178 50 L 186 50 L 186 62 Z" fill="#222"/>
  <path d="M 178 170 L 186 170 L 186 158 Z" fill="#222"/>
  <text x="176" y="40" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">S</text>
  <text x="176" y="190" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">S</text>
  <text x="250" y="105" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">A</text>
  <text x="230" y="128" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">単原子分子</text>
  <text x="420" y="105" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">B</text>
  <text x="400" y="128" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">二原子分子</text>
  <!-- dimension: stopper position to right end corresponds to 2V1 -->
  <line x1="186" y1="215" x2="520" y2="215" stroke="#888" stroke-width="1" marker-start="url(#q-ar)" marker-end="url(#q-ar)"/>
  <line x1="186" y1="172" x2="186" y2="222" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="520" y1="172" x2="520" y2="222" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="290" y="234" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">この部分の容積 2<tspan font-family="Times New Roman, serif" font-style="italic" font-size="15">V</tspan><tspan baseline-shift="sub" font-size="10">1</tspan></text>
</svg>
