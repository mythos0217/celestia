<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 370">
  <defs>
    <marker id="q-ak" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#222"/></marker>
  </defs>
  <!-- left: natural length (reference) drawn dashed -->
  <!-- floor -->
  <line x1="40" y1="330" x2="440" y2="330" stroke="#222" stroke-width="1.6"/>
  <g stroke="#222" stroke-width="1">
    <line x1="50" y1="330" x2="42" y2="340"/><line x1="70" y1="330" x2="62" y2="340"/><line x1="90" y1="330" x2="82" y2="340"/>
    <line x1="110" y1="330" x2="102" y2="340"/><line x1="130" y1="330" x2="122" y2="340"/><line x1="150" y1="330" x2="142" y2="340"/>
    <line x1="170" y1="330" x2="162" y2="340"/><line x1="190" y1="330" x2="182" y2="340"/><line x1="210" y1="330" x2="202" y2="340"/>
    <line x1="230" y1="330" x2="222" y2="340"/><line x1="250" y1="330" x2="242" y2="340"/><line x1="270" y1="330" x2="262" y2="340"/>
    <line x1="290" y1="330" x2="282" y2="340"/><line x1="310" y1="330" x2="302" y2="340"/><line x1="330" y1="330" x2="322" y2="340"/>
    <line x1="350" y1="330" x2="342" y2="340"/><line x1="370" y1="330" x2="362" y2="340"/><line x1="390" y1="330" x2="382" y2="340"/>
    <line x1="410" y1="330" x2="402" y2="340"/>
  </g>
  <!-- compressed state: plate top at y = -D (pixel 250) ; natural length top at pixel 130 -->
  <!-- spring from floor 330 up to plate bottom 262 -->
  <polyline points="200,330 200,322 180,316 220,308 180,300 220,292 180,284 220,276 200,270 200,262" fill="none" stroke="#222" stroke-width="1.4"/>
  <rect x="150" y="250" width="100" height="12" fill="none" stroke="#222" stroke-width="1.6"/>
  <text x="262" y="262" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">A</text>
  <text x="276" y="262" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">（質量 </text>
  <text x="319" y="262" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">M</text>
  <text x="333" y="262" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">）</text>
  <rect x="180" y="222" width="40" height="28" fill="none" stroke="#222" stroke-width="1.6"/>
  <text x="228" y="240" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">B</text>
  <text x="246" y="240" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">（質量 </text>
  <text x="289" y="240" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">m</text>
  <text x="301" y="240" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">）</text>
  <text x="160" y="300" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">k</text>
  <!-- natural length level -->
  <line x1="120" y1="130" x2="300" y2="130" stroke="#888" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="304" y="126" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">ばねが自然の長さのときの</text>
  <text x="304" y="144" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">A の上面の位置</text>
  <!-- y axis -->
  <line x1="90" y1="300" x2="90" y2="40" stroke="#222" stroke-width="1.2" marker-end="url(#q-ak)"/>
  <text x="98" y="48" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">y</text>
  <line x1="84" y1="130" x2="96" y2="130" stroke="#222" stroke-width="1.2"/>
  <text x="66" y="135" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">0</text>
  <line x1="84" y1="250" x2="150" y2="250" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- D dimension -->
  <line x1="120" y1="134" x2="120" y2="246" stroke="#222" stroke-width="1" marker-end="url(#q-ak)"/>
  <line x1="120" y1="246" x2="120" y2="134" stroke="#222" stroke-width="1" marker-end="url(#q-ak)"/>
  <text x="126" y="196" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">D</text>
</svg>
